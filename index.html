<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Find the Hidden Treasure — 3D</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #7a5b3a; touch-action: none; }
  #game { position: fixed; inset: 0; }
  canvas { display: block; }

  .bubble-font { font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive, sans-serif; }

  #title {
    position: fixed; top: 10px; left: 0; right: 0; text-align: center; pointer-events: none;
    font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
    font-size: clamp(22px, 5vw, 44px); font-weight: bold; color: #8a7300;
    text-shadow: 0 2px 0 #fff70044, -2px -2px 0 #c6e526, 2px -2px 0 #c6e526, -2px 2px 0 #c6e526, 2px 2px 0 #c6e526, 0 5px 8px rgba(0,0,0,.35);
    letter-spacing: 1px;
  }
  #hud {
    position: fixed; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; pointer-events: none;
    font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif; font-weight: bold;
  }
  .pill {
    background: #4b3620; color: #fff; border: 3px solid #c6e526; border-radius: 999px;
    padding: 6px 14px; font-size: 16px; box-shadow: 0 3px 6px rgba(0,0,0,.4); width: max-content;
  }
  #mission {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); pointer-events: none;
    background: #4b3620; color: #fff; border: 4px solid #c6e526; border-radius: 999px;
    padding: 10px 26px; font-size: clamp(14px, 2.6vw, 20px); font-weight: bold; text-align: center;
    font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
    box-shadow: 0 4px 10px rgba(0,0,0,.45); max-width: 86vw; transition: opacity .3s;
  }
  #help {
    position: fixed; top: 12px; right: 12px; pointer-events: none; text-align: right;
    font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif;
    color: #fff; font-size: 13px; font-weight: bold; text-shadow: 0 1px 3px #000;
    background: rgba(75,54,32,.75); border: 2px solid #c6e526; border-radius: 12px; padding: 8px 12px;
  }
  #win {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 20;
    background: rgba(40, 25, 5, .55); backdrop-filter: blur(3px);
  }
  #win .card {
    background: #c6e526; border: 6px solid #8a7300; border-radius: 28px; padding: 34px 44px; text-align: center;
    font-family: "Comic Sans MS", "Chalkboard SE", cursive, sans-serif; color: #6b5600;
    box-shadow: 0 12px 40px rgba(0,0,0,.5); animation: pop .45s ease-out;
  }
  #win h1 { margin: 0 0 8px; font-size: clamp(26px, 6vw, 46px); }
  #win p { margin: 4px 0 18px; font-size: 18px; font-weight: bold; }
  #win button {
    font-family: inherit; font-size: 20px; font-weight: bold; cursor: pointer;
    background: #4b3620; color: #fff; border: 3px solid #fff; border-radius: 999px; padding: 12px 30px;
  }
  #win button:hover { transform: scale(1.05); }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* touch controls */
  #joy {
    position: fixed; display: none; z-index: 10;
    left: calc(22px + env(safe-area-inset-left, 0px));
    bottom: calc(30px + env(safe-area-inset-bottom, 0px));
    width: 128px; height: 128px; border-radius: 50%;
    background: rgba(255,255,255,.15); border: 3px solid rgba(255,255,255,.5);
    touch-action: none; -webkit-touch-callout: none;
  }
  #joyKnob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; border-radius: 50%;
    background: #c6e526; border: 3px solid #8a7300; transform: translate(-50%,-50%);
  }
  .tbtn {
    position: fixed; width: 86px; height: 86px; border-radius: 50%; display: none; z-index: 10;
    align-items: center; justify-content: center; font-family: "Comic Sans MS", cursive, sans-serif;
    font-size: 18px; font-weight: bold; color: #4b3620; background: #c6e526e0; border: 3px solid #8a7300;
    user-select: none; -webkit-user-select: none; touch-action: none; -webkit-touch-callout: none;
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
  }
  #btnJump { right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(102px + env(safe-area-inset-bottom, 0px)); }
  #btnDig  { right: calc(112px + env(safe-area-inset-right, 0px)); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); }
  .touch #joy, .touch .tbtn { display: flex; }
  /* phones: hide keyboard hints, move the mission banner up out of thumb range */
  .touch #help { display: none; }
  .touch #title { font-size: clamp(18px, 4vw, 30px); top: calc(8px + env(safe-area-inset-top, 0px)); }
  .touch #mission {
    bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 56px);
    font-size: 14px; padding: 7px 16px; max-width: 92vw;
  }
  .touch #hud .pill { font-size: 13px; padding: 4px 11px; border-width: 2px; }
  .touch #hud { top: calc(8px + env(safe-area-inset-top, 0px)); left: calc(8px + env(safe-area-inset-left, 0px)); }
</style>
</head>
<body>
<div id="game"></div>
<div id="title">Find the hidden treasure</div>
<div id="hud">
  <div class="pill">⭐ Stars: <span id="stars">0</span> / <span id="starsTotal">0</span></div>
  <div class="pill">❌ Spots dug: <span id="dug">0</span> / <span id="dugTotal">0</span></div>
</div>
<div id="help">Move: WASD / arrows · Jump: Space<br>Dig on a ❌: E</div>
<div id="mission">Your Mission: find the ❌ marks and dig up the hidden treasure!</div>
<div id="win">
  <div class="card">
    <h1>🏆 You found the hidden treasure! 🏆</h1>
    <p id="winStats"></p>
    <button id="again">Play again</button>
  </div>
</div>
<div id="joy"><div id="joyKnob"></div></div>
<div class="tbtn" id="btnJump">JUMP</div>
<div class="tbtn" id="btnDig">DIG</div>
<script src="vendor/three.global.js"></script>
<script src="game.js"></script>
</body>
</html>
