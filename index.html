<title>Explorer's Passport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Lexend:wght@300;400;500;600&family=Courier+Prime:wght@400;700&display=swap">
<style>
  :root{
    --ground:#F2EBD8;
    --card:#FFFCF3;
    --card-2:#FAF2E0;
    --ink:#15303C;
    --ink-soft:#56707C;
    --line:#D5C5A2;
    --line-soft:#E6DAC0;
    --sea:#0E7C93;
    --marigold:#D9900B;
    --tomato:#C94630;
    --moss:#3C8B4E;
    --land:#CBDEBB;
    --land-line:#9DBD86;
    --on-accent:#FFFCF3;
    --shadow:rgba(21,48,60,.14);
    --su-math:#A8620F;
    --su-sci:#0E7C93;
    --su-hist:#A3422A;
    --su-geo:#3C7A4A;
    --su-eng:#73467F;
    --su-soc:#355385;
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0C1B23;
      --card:#142833;
      --card-2:#1A323F;
      --ink:#ECF4F2;
      --ink-soft:#9BB4BD;
      --line:#2A4452;
      --line-soft:#213845;
      --sea:#48BED3;
      --marigold:#F0B848;
      --tomato:#F07459;
      --moss:#5FC177;
      --land:#2C4C47;
      --land-line:#3E6B60;
      --on-accent:#0C1B23;
      --shadow:rgba(0,0,0,.45);
      --su-math:#E7A845;
      --su-sci:#48BED3;
      --su-hist:#E8886A;
      --su-geo:#6FC185;
      --su-eng:#C294D0;
      --su-soc:#8FAEE0;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0C1B23;
    --card:#142833;
    --card-2:#1A323F;
    --ink:#ECF4F2;
    --ink-soft:#9BB4BD;
    --line:#2A4452;
    --line-soft:#213845;
    --sea:#48BED3;
    --marigold:#F0B848;
    --tomato:#F07459;
    --moss:#5FC177;
    --land:#2C4C47;
    --land-line:#3E6B60;
    --on-accent:#0C1B23;
    --shadow:rgba(0,0,0,.45);
    --su-math:#E7A845;
    --su-sci:#48BED3;
    --su-hist:#E8886A;
    --su-geo:#6FC185;
    --su-eng:#C294D0;
    --su-soc:#8FAEE0;
  }

  *{box-sizing:border-box}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:"Lexend","Trebuchet MS",system-ui,sans-serif;
    font-size:16.5px;line-height:1.55;font-weight:300;
    padding-inline:18px;padding-block:26px 48px;
    display:flex;flex-direction:column;align-items:center;gap:20px;
  }
  .wrap{width:100%;max-width:700px;display:flex;flex-direction:column;gap:20px}

  .mast{display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center}
  .eyebrow{
    font-family:"Courier Prime","Courier New",monospace;
    font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);
  }
  h1{
    font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;
    font-weight:700;font-size:clamp(32px,7.2vw,46px);line-height:1;margin:0;
    letter-spacing:-.02em;color:var(--sea);text-wrap:balance;
  }
  .mast p{margin:0;color:var(--ink-soft);max-width:48ch;font-size:14.5px}

  /* ---------- the stamp grid: subjects across, rounds down ---------- */
  .board{
    background:var(--card-2);border:2px solid var(--line);border-radius:14px;
    padding:12px 12px 10px;display:flex;flex-direction:column;gap:7px;
  }
  .brow{display:grid;grid-template-columns:30px repeat(6,1fr);gap:6px;align-items:center}
  .bhead{
    font-family:"Courier Prime","Courier New",monospace;
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;text-align:center;color:var(--ink-soft);
  }
  .rlab{
    font-family:"Courier Prime","Courier New",monospace;
    font-size:11px;color:var(--ink-soft);text-align:center;
  }
  .cell{
    aspect-ratio:1;max-width:40px;width:100%;margin-inline:auto;border-radius:9px;
    border:2px dashed var(--line);background:transparent;
    display:grid;place-items:center;
    font-family:"Courier Prime","Courier New",monospace;font-size:10px;font-weight:700;
    color:var(--ink-soft);
  }
  .cell.hit{border-style:solid;border-color:var(--c);background:var(--c);color:var(--on-accent)}
  .cell.miss{border-style:solid;border-color:var(--tomato);color:var(--tomato)}
  .cell.now{border-style:solid;border-width:3px;border-color:var(--c);color:var(--c);animation:pulse 1.7s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}

  /* ---------- question card ---------- */
  .card{
    background:var(--card);border:2px solid var(--line);border-radius:var(--radius);
    box-shadow:0 9px 0 -4px var(--shadow);
    padding:20px;display:flex;flex-direction:column;gap:17px;
    border-top:5px solid var(--c,var(--sea));
  }
  .cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .stop{
    font-family:"Courier Prime","Courier New",monospace;
    font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);
  }
  .tag{
    font-family:"Courier Prime","Courier New",monospace;
    font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    padding:4px 11px;border-radius:999px;border:2px solid var(--c);color:var(--c);
  }
  h2{
    font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;
    font-weight:600;font-size:clamp(20px,4.4vw,26px);line-height:1.25;margin:0;text-wrap:balance;
  }

  .plate{
    margin:0;background:var(--card-2);border:2px solid var(--line-soft);border-radius:12px;
    padding:14px 12px 10px;display:flex;flex-direction:column;align-items:center;gap:9px;
    overflow-x:auto;
  }
  .plate svg{display:block;max-width:100%;height:auto}
  .plate figcaption{
    font-family:"Courier Prime","Courier New",monospace;
    font-size:11.5px;letter-spacing:.06em;color:var(--ink-soft);text-align:center;
  }

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  @media (max-width:560px){.choices{grid-template-columns:1fr}}
  .choice{
    font-family:"Lexend",sans-serif;font-size:16px;font-weight:400;color:var(--ink);
    background:var(--card);border:2.5px solid var(--line);border-radius:12px;
    min-height:54px;padding:11px 15px;cursor:pointer;text-align:left;
    transition:transform .12s ease,border-color .12s ease,background .12s ease;
  }
  .choice:hover:not(:disabled){transform:translateY(-2px);border-color:var(--c)}
  .choice:focus-visible{outline:3px solid var(--c);outline-offset:3px}
  .choice:disabled{cursor:default}
  .choice.right{background:var(--moss);border-color:var(--moss);color:var(--on-accent)}
  .choice.wrong{background:var(--tomato);border-color:var(--tomato);color:var(--on-accent)}
  .choice.dim{opacity:.42}

  .feedback{display:flex;flex-direction:column;gap:12px}
  .verdict{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:600;margin:0}
  .verdict.good{color:var(--moss)}
  .verdict.oops{color:var(--tomato)}
  .fact{
    border-left:5px solid var(--c);background:var(--card-2);border-radius:0 12px 12px 0;
    padding:12px 14px;display:flex;flex-direction:column;gap:4px;
  }
  .fact .label{
    font-family:"Courier Prime","Courier New",monospace;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--c);
  }
  .fact p{margin:0;font-size:15px}
  .next{
    align-self:flex-start;font-family:"Bricolage Grotesque",sans-serif;font-size:17px;font-weight:600;
    background:var(--sea);color:var(--on-accent);border:none;border-radius:999px;
    padding:11px 24px;cursor:pointer;transition:transform .12s ease;
  }
  .next:hover{transform:translateY(-2px)}
  .next:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}
  .roundbar{
    display:flex;gap:10px;align-items:flex-start;background:var(--marigold);color:#15303C;
    border-radius:12px;padding:11px 14px;font-size:14.5px;line-height:1.45;
  }
  .roundbar strong{font-family:"Bricolage Grotesque",sans-serif;font-weight:700}

  /* ---------- word-work cards, used by the English questions ---------- */
  .wcard{
    background:var(--card);border:2px solid var(--line);border-radius:12px;
    padding:16px 20px;display:flex;flex-direction:column;align-items:center;gap:9px;
    max-width:100%;
  }
  .wcard-label{
    font-family:"Courier Prime","Courier New",monospace;
    font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-soft);
  }
  .wcard-big{
    font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(24px,5.5vw,34px);
    font-weight:600;color:var(--ink);text-align:center;line-height:1.15;
  }
  .wcard-sub{font-family:"Courier Prime","Courier New",monospace;font-size:12.5px;color:var(--ink-soft)}
  .sent p{margin:0;font-size:clamp(16px,3.6vw,19px);line-height:1.55;text-align:center;max-width:40ch}
  .sent b{background:var(--marigold);color:#15303C;padding:1px 7px;border-radius:6px;font-weight:600}
  .passage{align-items:flex-start}
  .passage p{margin:0 0 7px;font-size:15px;line-height:1.6;max-width:46ch}
  .passage p:last-child{margin-bottom:0}
  .chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{
    background:var(--sea);color:var(--on-accent);border-radius:9px;padding:8px 14px;
    font-family:"Bricolage Grotesque",sans-serif;font-size:20px;font-weight:600;
  }
  .chip-root{background:var(--tomato)}
  .chip-suf{background:var(--moss)}
  .plus{color:var(--ink-soft);font-size:17px}

  /* ---------- finish ---------- */
  .finish{align-items:center;text-align:center;gap:14px;border-top-color:var(--sea)}
  .score{
    font-family:"Bricolage Grotesque",sans-serif;font-size:58px;font-weight:700;line-height:1;
    color:var(--marigold);font-variant-numeric:tabular-nums;
  }
  .rank{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:600;margin:0;color:var(--sea)}
  .finish p{margin:0;max-width:46ch;color:var(--ink-soft);font-size:15px}
  .bysub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:440px}
  @media (max-width:420px){.bysub{grid-template-columns:repeat(2,1fr)}}
  .sub{
    border:2px solid var(--c);border-radius:10px;padding:7px 9px;
    display:flex;flex-direction:column;gap:2px;align-items:center;
  }
  .sub b{font-family:"Bricolage Grotesque",sans-serif;font-size:19px;font-weight:700;color:var(--c)}
  .sub span{font-family:"Courier Prime",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
  .again{
    font-family:"Bricolage Grotesque",sans-serif;font-size:17px;font-weight:600;
    background:var(--marigold);color:#15303C;border:none;border-radius:999px;
    padding:11px 26px;cursor:pointer;
  }
  .again:focus-visible{outline:3px solid var(--sea);outline-offset:3px}
  .foot{
    font-family:"Courier Prime","Courier New",monospace;
    font-size:11px;letter-spacing:.09em;color:var(--ink-soft);text-align:center;
  }
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>

<div class="wrap">
  <header class="mast">
    <div class="eyebrow">18 questions drawn from 500 · ages 9 and up</div>
    <h1>Explorer's Passport</h1>
    <p>Six subjects, three rounds, getting harder each time. Every question you get right stamps its square.</p>
  </header>

  <div class="board" id="board" aria-label="Progress by subject and round"></div>
  <main id="stage" aria-live="polite"></main>
  <p class="foot" id="foot">Drawn fresh every time you play</p>
</div>

<script src="art.js"></script>
<script src="art-math.js"></script>
<script src="art-science.js"></script>
<script src="art-humanities.js"></script>
<script src="bank-math.js"></script>
<script src="bank-science.js"></script>
<script src="bank-geography.js"></script>
<script src="bank-history.js"></script>
<script src="bank-english.js"></script>
<script src="bank-social.js"></script>
<script>
var SUBJECTS = [
  { k:'math', name:'Maths',     short:'MA', tag:'Olympiad maths', v:'--su-math' },
  { k:'sci',  name:'Science',   short:'SC', tag:'Science',        v:'--su-sci'  },
  { k:'hist', name:'History',   short:'HI', tag:'History',        v:'--su-hist' },
  { k:'geo',  name:'Geography', short:'GE', tag:'Geography',      v:'--su-geo'  },
  { k:'eng',  name:'English',   short:'EN', tag:'English',        v:'--su-eng'  },
  { k:'soc',  name:'Society',   short:'SO', tag:'Social studies', v:'--su-soc'  }
];
var ROUNDS = [
  { n:1, label:'Warm up', blurb:'One question from each subject, to find your feet.' },
  { n:2, label:'Stretch', blurb:'Round two. These ask you to put two steps together.' },
  { n:3, label:'Olympiad', blurb:'Last round, and the hardest. Read each one twice before you answer.' }
];
var SEEN_KEY = 'passport10.seen.v1', SEEN_CAP = 60;

function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = a[i];
    a[i] = a[j]; a[j] = t;
  }
  return a;
}
function readSeen() {
  try { return JSON.parse(localStorage.getItem(SEEN_KEY)) || []; } catch (e) { return []; }
}
function writeSeen(ids) {
  try { localStorage.setItem(SEEN_KEY, JSON.stringify(ids.slice(-SEEN_CAP))); } catch (e) { /* fine without it */ }
}
/* one question per subject per round, preferring ones this browser has not had lately */
function pick(subject, difficulty, seen, taken) {
  var pool = [];
  BANK.forEach(function (q, i) {
    if (q.s === subject && q.d === difficulty && taken.indexOf(i) < 0) pool.push(i);
  });
  if (!pool.length) {
    BANK.forEach(function (q, i) { if (q.s === subject && taken.indexOf(i) < 0) pool.push(i); });
  }
  var fresh = pool.filter(function (i) { return seen.indexOf(i) < 0; });
  var bag = fresh.length ? fresh : pool;
  return bag[Math.floor(Math.random() * bag.length)];
}
function newTrip() {
  var seen = readSeen(), taken = [], trip = [];
  ROUNDS.forEach(function (r, ri) {
    var round = [];
    SUBJECTS.forEach(function (s, si) {
      var id = pick(s.k, r.n, seen, taken);
      taken.push(id);
      var q = BANK[id], c = q.c.slice();
      var numeric = c.every(function (v) { return /^-?[\d,]+$/.test(v); });
      if (numeric) c.sort(function (a, b) { return parseFloat(a.replace(/,/g, '')) - parseFloat(b.replace(/,/g, '')); });
      else shuffle(c);
      round.push({ id:id, q:q, choices:c, answer:c.indexOf(q.a), cell:ri * 6 + si, round:ri, subj:si });
    });
    trip = trip.concat(shuffle(round));
  });
  writeSeen(seen.concat(taken));
  return trip;
}

var board = document.getElementById('board'),
    stage = document.getElementById('stage'),
    foot  = document.getElementById('foot');
var trip = [], index = 0, score = 0, marks = [];

function drawBoard() {
  var here = index < trip.length ? trip[index].cell : -1;
  var html = '<div class="brow"><span></span>' + SUBJECTS.map(function (s) {
    return '<span class="bhead" style="color:var(' + s.v + ')">' + s.short + '</span>';
  }).join('') + '</div>';
  ROUNDS.forEach(function (r, ri) {
    html += '<div class="brow"><span class="rlab">' + r.n + '</span>';
    SUBJECTS.forEach(function (s, si) {
      var cell = ri * 6 + si, cls = 'cell';
      if (marks[cell] === true) cls += ' hit';
      else if (marks[cell] === false) cls += ' miss';
      else if (cell === here) cls += ' now';
      html += '<span class="' + cls + '" style="--c:var(' + s.v + ')">' + s.short + '</span>';
    });
    html += '</div>';
  });
  board.innerHTML = html;
}

function drawStop() {
  var item = trip[index], q = item.q, s = SUBJECTS[item.subj], r = ROUNDS[item.round];
  var first = index % 6 === 0;
  stage.innerHTML =
    '<section class="card" style="--c:var(' + s.v + ')">' +
      (first ? '<div class="roundbar"><span><strong>Round ' + r.n + ' · ' + r.label + '.</strong> ' + r.blurb + '</span></div>' : '') +
      '<div class="cardhead">' +
        '<span class="stop">Question ' + (index + 1) + ' of ' + trip.length + ' · round ' + r.n + '</span>' +
        '<span class="tag">' + s.tag + '</span>' +
      '</div>' +
      '<h2>' + q.q + '</h2>' +
      '<figure class="plate">' + renderArt(q.art) + '<figcaption>' + q.cap + '</figcaption></figure>' +
      '<div class="choices">' +
        item.choices.map(function (c, i) {
          return '<button class="choice" id="choice-' + i + '" data-i="' + i + '">' + c + '</button>';
        }).join('') +
      '</div><div id="feedback"></div>' +
    '</section>';
  Array.prototype.forEach.call(document.querySelectorAll('.choice'), function (b) {
    b.addEventListener('click', function () { answer(Number(b.dataset.i)); });
  });
  drawBoard();
}

function answer(picked) {
  var item = trip[index], q = item.q, right = picked === item.answer;
  marks[item.cell] = right;
  if (right) score++;
  Array.prototype.forEach.call(document.querySelectorAll('.choice'), function (b) {
    var i = Number(b.dataset.i);
    b.disabled = true;
    if (i === item.answer) b.classList.add('right');
    else if (i === picked) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  var last = index === trip.length - 1;
  document.getElementById('feedback').innerHTML =
    '<div class="feedback">' +
      '<p class="verdict ' + (right ? 'good' : 'oops') + '">' +
        (right ? 'Correct.' : 'Not this time — the answer is ' + item.choices[item.answer] + '.') + '</p>' +
      '<div class="fact"><span class="label">Why</span><p>' + q.n + '</p></div>' +
      '<button class="next" id="next">' +
        (last ? 'See my passport' : (index % 6 === 5 ? 'Start round ' + (item.round + 2) : 'Next question')) +
      '</button></div>';
  document.getElementById('next').addEventListener('click', function () {
    if (last) { index = trip.length; drawBoard(); finish(); }
    else { index++; drawStop(); document.querySelector('h2').scrollIntoView({ block:'nearest' }); }
  });
  drawBoard();
}

var RANKS = [
  { min:18, title:'Grand Explorer', line:'Eighteen out of eighteen, across six subjects and three rounds. Nothing left to conquer.' },
  { min:15, title:'Expedition Leader', line:'That is a serious score. The Olympiad round beats most adults.' },
  { min:12, title:'Field Scientist', line:'Strong work. Look at which columns lost you squares and head back there.' },
  { min:8,  title:'Cartographer', line:'A good haul. The later rounds are meant to be hard — try a fresh set.' },
  { min:4,  title:'Trail Blazer', line:'You are finding your way. Every trip draws different questions.' },
  { min:0,  title:'Packing Bags', line:'Every explorer starts somewhere. Set off again.' }
];

function finish() {
  var rank = RANKS.find(function (r) { return score >= r.min; });
  stage.innerHTML =
    '<section class="card finish">' +
      '<span class="stop">Expedition complete</span>' +
      '<div class="score">' + score + '<span style="font-size:24px;color:var(--ink-soft)"> / ' + trip.length + '</span></div>' +
      '<h2 class="rank">' + rank.title + '</h2>' +
      '<div class="bysub">' + SUBJECTS.map(function (s, si) {
        var got = [0, 1, 2].filter(function (ri) { return marks[ri * 6 + si] === true; }).length;
        return '<div class="sub" style="--c:var(' + s.v + ')"><b>' + got + '/3</b><span>' + s.name + '</span></div>';
      }).join('') + '</div>' +
      '<p>' + rank.line + '</p>' +
      '<button class="again" id="again">Draw a new expedition</button>' +
      '<p class="foot">18 fresh questions from the ' + BANK.length + ' in the bank.</p>' +
    '</section>';
  document.getElementById('again').addEventListener('click', function () { start({}); });
}

function start(state) {
  trip = (state && state.trip) || newTrip();
  index = (state && state.index) || 0;
  score = (state && state.score) || 0;
  marks = (state && state.marks) || [];
  foot.textContent = 'Drawn from ' + BANK.length + ' questions · six subjects · three rounds';
  if (index >= trip.length) finish(); else drawStop();
  drawBoard();
}

if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
  window.claude.hot.snapshot(function () {
    return { trip:trip, index:index, score:score, marks:marks };
  });
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
