<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Greenprint City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: the city (street view or lit model-table map) on top; below it one planning step
   beside a live report and a feed of resident reactions. Category colors follow the
   land-use map convention: residential yellow, commercial red, industrial purple, parks green. */
:root{
  --bg:#E9EFEB; --surface:#FFFFFF; --surface-2:#DCE5E0; --ink:#13221C; --ink-2:#4A5D55; --line:#C3CFC9;
  --accent:#2443A6; --accent-ink:#FFFFFF; --accent-soft:#DCE3F7;
  --good:#23794A; --warn:#A8660C; --bad:#B23A2E;
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1411; --surface:#141F1A; --surface-2:#1C2924; --ink:#E3ECE7; --ink-2:#9AAEA5; --line:#2A3A33;
  --accent:#9DB1FF; --accent-ink:#0C1411; --accent-soft:#1E2A4A;
  --good:#63C78F; --warn:#E6AA4E; --bad:#F07467; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1411; --surface:#141F1A; --surface-2:#1C2924; --ink:#E3ECE7; --ink-2:#9AAEA5; --line:#2A3A33;
  --accent:#9DB1FF; --accent-ink:#0C1411; --accent-soft:#1E2A4A;
  --good:#63C78F; --warn:#E6AA4E; --bad:#F07467; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:grid;gap:14px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.02em;display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand small{font-family:var(--f-mono);font-weight:500;font-size:.72rem;letter-spacing:.08em;color:var(--ink-2);text-transform:uppercase}
.city-btn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;cursor:pointer}
.city-btn .pin{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.7rem;font-weight:700}
.city-btn b{font-family:var(--f-display);font-weight:700}
.ghost{background:none;border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.ghost:hover{color:var(--ink)}

.chapters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chap{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 8px;cursor:pointer;font-weight:700}
.chap .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;background:var(--surface-2);color:var(--ink-2)}
.chap[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chap[aria-current="true"] .n,.chap.done .n{background:var(--chap-col);color:#13221C}

.stage{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#101820}
.stage canvas{display:block;width:100%;aspect-ratio:1000/440;max-width:100%;touch-action:pan-y}
.stage .tag{position:absolute;left:10px;top:10px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:6px;padding:3px 8px;color:var(--ink-2)}
.viewtoggle{position:absolute;right:10px;top:10px;display:flex;background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:999px;padding:3px;gap:2px}
.viewtoggle button{border:none;background:none;border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--ink-2);min-height:30px}
.viewtoggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.maplegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--ink-2);margin-top:-6px}
.maplegend span{display:inline-flex;align-items:center;gap:6px}
.maplegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.maplegend i.dot{border-radius:50%}

.main{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.side{display:grid;gap:14px;min-width:0}
.panel,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.stepchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-family:var(--f-mono);font-size:.72rem;cursor:pointer;color:var(--ink-2);text-transform:none}
.stepchip[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance;margin:0}
.panel h2{font-size:clamp(1.4rem,3.2vw,1.9rem);font-weight:700;margin-top:8px;line-height:1.15}
.lede{color:var(--ink-2);margin:6px 0 16px;max-width:62ch}
.control{display:grid;gap:14px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;font-weight:700;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}

.info{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:.95rem;max-width:70ch}
.info b{font-family:var(--f-display)}
.info-btn{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:Georgia,serif;font-style:italic;font-weight:700;cursor:pointer;font-size:.85rem;line-height:1;color:var(--ink);padding:0}
.info-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.pbar-track{position:relative;height:72px;margin:6px 11px 0}
.pbar-segs{position:absolute;inset:0;display:flex;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.seg{height:100%;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-family:var(--f-mono);font-size:.82rem;white-space:nowrap;overflow:hidden}
.handle{position:absolute;top:50%;width:24px;height:52px;margin:-26px 0 0 -12px;border-radius:12px;border:2px solid var(--ink);background:var(--surface);cursor:ew-resize;touch-action:none;padding:0;display:grid;place-items:center;z-index:2;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.handle::before{content:"";width:8px;height:18px;border-left:2px solid var(--ink-2);border-right:2px solid var(--ink-2)}
.handle.drag{transform:scale(1.08)}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px 14px;margin-top:6px}
.lg{display:flex;align-items:center;gap:8px;min-width:0}
.lg .chip{width:14px;height:14px;border-radius:4px;flex:0 0 14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.lg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.9rem}

.fan{width:100%;max-width:540px;margin:0 auto;display:block;touch-action:none}
.fan .fh{cursor:grab}
.fan text{font-family:var(--f-mono);font-size:13px}

.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}
.lvl{display:grid;gap:8px}
.tank{position:relative;height:210px;border-radius:12px;background:repeating-linear-gradient(to top,var(--surface-2) 0 1px,transparent 1px 21px),var(--surface);border:1px solid var(--line);cursor:ns-resize;touch-action:none;overflow:hidden}
.tank .fill{position:absolute;left:0;right:0;bottom:0;background:var(--lc);opacity:.85;border-top:3px solid var(--lc)}
.tank .icon{position:absolute;right:10px;bottom:10px;width:84px;height:84px;border-radius:20px;background:#F4F7FA;border:3px solid var(--lc);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.tank .icon svg{width:60px;height:60px}
.lvh{position:absolute;left:24%;width:52px;height:30px;margin:-15px 0 0 -26px;border-radius:9px;border:2px solid var(--ink);background:var(--surface);display:grid;place-items:center;padding:0;cursor:ns-resize;z-index:2}
.lvh::before{content:"";width:20px;height:8px;border-top:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2)}
.lvl .cap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvl .cap b{font-family:var(--f-display);font-size:1.1rem}
.lvl .cap .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lvl .note{color:var(--ink-2);font-size:.88rem}

.single{display:grid;gap:4px}
.single .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.single output{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.single .unit{color:var(--ink-2)}
.range-wrap{position:relative;padding:8px 0 30px}
input[type=range]{width:100%;accent-color:var(--accent);height:36px;margin:0}
.mark{position:absolute;bottom:0;transform:translateX(-50%);font-family:var(--f-mono);font-size:.7rem;color:var(--ink-2);white-space:nowrap}
.mark::before{content:"";display:block;width:2px;height:8px;background:var(--ink-2);margin:0 auto 2px}
.sub-slider{border-top:1px dashed var(--line);padding-top:12px;margin-top:4px}
.sub-slider .lab{display:flex;align-items:center;gap:8px;font-weight:700}
.sub-slider output{font-family:var(--f-mono);font-weight:500;font-size:1rem;margin-left:auto}

.rank{list-style:none;margin:0;padding:0;display:grid;gap:8px;touch-action:pan-y}
.rk{display:grid;grid-template-columns:30px 34px minmax(0,1fr) auto;align-items:center;gap:8px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;user-select:none}
.rk.lift{box-shadow:0 8px 20px rgba(0,0,0,.22);border-color:var(--accent);position:relative;z-index:3}
.rk .num{font-family:var(--f-display);font-weight:800;font-size:1.4rem;text-align:center;color:var(--ink-2)}
.rk:first-child .num{color:var(--accent)}
.grip{width:34px;height:40px;border:none;background:none;cursor:grab;touch-action:none;display:grid;place-items:center;padding:0}
.grip::before{content:"";width:16px;height:12px;border-top:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);box-shadow:inset 0 5px 0 -3px var(--ink-2)}
.rk .t b{display:block;font-family:var(--f-display);font-size:1.05rem}
.rk .t span{color:var(--ink-2);font-size:.88rem;display:block}
.rk .acts{display:flex;gap:4px;align-items:center}
.rk .ex{grid-column:3/-1;display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2)}
.rk .ex svg{width:62px;height:36px;flex:0 0 62px}
.rk .ex .c{font-family:var(--f-mono);color:var(--ink);font-size:.95rem}
.supply{display:flex;align-items:center;gap:8px;min-width:150px;flex:1}
.supply .sb{flex:1;height:8px;border-radius:4px;background:var(--surface);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.supply .sb i{position:absolute;inset:0 auto 0 0;background:var(--sc)}
.supply .sb s{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,transparent 0 3px,var(--ink-2) 3px 4px);opacity:.45}
@media (max-width:560px){.rk .ex{grid-column:1/-1}.rk .t span{font-size:.82rem}}
.mini{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.8rem;padding:0}
.mini:disabled{opacity:.3;cursor:default}

.card h3{font-size:1.05rem;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ringrow{display:flex;align-items:center;gap:14px;margin:10px 0 14px}
.ring{width:84px;height:84px;flex:0 0 84px}
.ring text{font-family:var(--f-display);font-weight:800}
.co2 .v{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.co2 .u{color:var(--ink-2);font-size:.82rem}
.meters{display:grid;gap:12px}
.meter .lbl{display:flex;justify-content:space-between;font-size:.9rem;gap:8px}
.meter .lbl span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bar{position:relative;height:10px;border-radius:6px;background:var(--surface-2);margin-top:4px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--mcol);transition:width .25s}
.bar s{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.7}
.delta{font-family:var(--f-mono);font-size:.75rem;margin-left:6px}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.keynote{font-size:.78rem;color:var(--ink-2);margin-top:12px;display:flex;align-items:center;gap:6px}
.keynote s{display:inline-block;width:2px;height:12px;background:var(--ink);opacity:.7}
.feed{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.feed li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;padding:8px;border-radius:10px;background:var(--surface-2);animation:pop .35s ease-out}
.feed .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:.85rem;color:#13221C;background:var(--mood)}
.feed .who{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.04em;color:var(--ink-2);text-transform:uppercase}
.feed .tx{font-size:.92rem;line-height:1.35}
@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}

.start{display:grid;gap:14px}
.start h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;line-height:1.05;max-width:22ch}
.start p{color:var(--ink-2);max-width:62ch;margin:0}
.cities{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cityc{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:grid;gap:10px}
.cityc:hover{border-color:var(--accent)}
.cityc b{font-family:var(--f-display);font-size:1.3rem}
.cityc span.tg{color:var(--ink-2);font-size:.9rem}
.traits{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-family:var(--f-mono);font-size:.72rem;align-items:center;color:var(--ink-2)}
.traits i{display:block;height:6px;border-radius:3px;background:var(--surface-2);position:relative;overflow:hidden}
.traits i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--ink-2);border-radius:3px}

.grade-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:6px 0 16px}
.grade{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:3rem;background:var(--gcol);color:#fff;flex:0 0 92px}
.cmp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.tblwrap{overflow-x:auto}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:8px 0}
.stack span{height:100%}
.fb{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}
.fb h3{font-size:1.05rem;margin-bottom:6px}
.fb ul{margin:0;padding-left:0;list-style:none;display:grid;gap:8px}
.fb li{padding:8px 10px;border-radius:8px;background:var(--surface-2);border-left:3px solid var(--c);font-size:.95rem}
.muted{color:var(--ink-2);font-size:.85rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">Greenprint City <small>Plan for 2050</small></div>
    <button class="city-btn" id="cityBtn" type="button" hidden><span class="pin">◎</span><b id="cityName"></b></button>
    <button class="ghost" id="restart" type="button" hidden>Start over</button>
  </header>
  <nav class="chapters" id="chapters" aria-label="Planning chapters" hidden></nav>
  <div class="stage">
    <canvas id="scene" aria-label="Illustration of your city that changes as you plan"></canvas>
    <span class="tag" id="stageTag">Your city in 2050</span>
    <div class="viewtoggle" role="group" aria-label="City view">
      <button type="button" id="vStreet" aria-pressed="true">Street</button>
      <button type="button" id="vMap" aria-pressed="false">Map</button>
    </div>
  </div>
  <div class="maplegend" id="mapLegend" hidden></div>
  <section class="start" id="start" hidden></section>
  <div class="main" id="main" hidden>
    <section class="panel" id="panel" aria-live="polite"></section>
    <aside class="side">
      <div class="card" id="report"></div>
      <div class="card" id="voices"></div>
    </aside>
  </div>
</div>

<script>
"use strict";
/* ================= data ================= */
// pot: how well each renewable suits the city (1 = good). caps: most of the grid a source can supply by 2050.
const CITIES = [
  {id:'sf', name:'San Francisco', tag:'Foggy summers, strong Pacific wind, ocean waves, geothermal fields to the north, very expensive land.',
   pot:{solar:.8,wind:1.1,geo:.9,wave:.8,hydro:.6}, heat:.3, cold:.35, flood:.8, land:1.35,
   caps:{nuclear:.2,gas:.5,oil:.05,coal:.05}, gasCost:7,
   start:{order:['renew','gas','nuclear','coal','oil'], renew:[40,20,15,5,20], battery:15, micro:5,
     bmix:[55,15,30], green:14, live:[32,48,20], work:[40,20,15,25], retro:20, newStd:30,
     tech:['ev','av','bike','scooter','hsr'], tmix:[20,5,55,12,8], gmix:[70,25,5], canopy:14, roofs:3}},
  {id:'phx', name:'Phoenix', tag:'Over 300 sunny days a year, extreme summer heat, no coastline and little water.',
   pot:{solar:1.3,wind:.6,geo:.5,wave:0,hydro:.35}, heat:1, cold:.1, flood:.3, land:.8,
   caps:{nuclear:.3,gas:.45,oil:.05,coal:.15}, gasCost:6.5,
   start:{order:['gas','nuclear','coal','renew','oil'], renew:[55,10,5,0,30], battery:10, micro:3,
     bmix:[66,6,28], green:9, live:[72,23,5], work:[28,24,16,32], retro:10, newStd:20,
     tech:['ev','av','scooter','bike','hsr'], tmix:[12,4,74,7,3], gmix:[55,40,5], canopy:10, roofs:1}},
  {id:'osl', name:'Oslo', tag:'Long dark winters, forested hills, and rivers that already power most of the grid.',
   pot:{solar:.5,wind:.9,geo:.2,wave:.5,hydro:1.4}, heat:.1, cold:1, flood:.5, land:1.1,
   caps:{nuclear:.15,gas:.25,oil:.05,coal:.05}, gasCost:8,
   start:{order:['renew','gas','oil','nuclear','coal'], renew:[3,12,0,0,85], battery:8, micro:5,
     bmix:[52,26,22], green:28, live:[24,60,16], work:[44,24,10,22], retro:35, newStd:50,
     tech:['ev','bike','hsr','scooter','av'], tmix:[24,12,36,13,15], gmix:[55,40,5], canopy:30, roofs:8}},
  {id:'sgp', name:'Singapore', tag:'Hot and humid all year, almost no spare land, heavy tropical rain, calm winds.',

/* ================= model ================= */
function energy(st,city){
  const R=st.energy.renew.map(v=>v/100);
  const p=RENEW.map(r=>city.pot[r.id]);
  const firm=sum(R.map((s,k)=>s*RENEW[k].firm));
  const quality=sum(R.map((s,k)=>s*Math.min(1,p[k])));
  const bat=st.energy.battery/100, mic=st.energy.micro/100;
  const renewCap=c01((.3+.6*firm+.5*bat+.2*mic)*(.5+.5*quality));
  const renewCost=sum(R.map((s,k)=>s*RENEW[k].cost/Math.max(.12,p[k])));
  const renewCo2=sum(R.map((s,k)=>s*RENEW[k].co2));
  const src={nuclear:{cap:city.caps.nuclear,cost:14,co2:12},renew:{cap:renewCap,cost:renewCost,co2:renewCo2},
    gas:{cap:city.caps.gas,cost:city.gasCost,co2:490},oil:{cap:city.caps.oil,cost:20,co2:650},coal:{cap:city.caps.coal,cost:11,co2:820}};
  let left=1;const share={};
  st.energy.order.forEach(id=>{const s=Math.min(left,src[id].cap);share[id]=s;left-=s;});
  const imports=Math.max(0,left);
  const co2=sum(Object.keys(share).map(k=>share[k]*src[k].co2))+imports*500;
  const cost=sum(Object.keys(share).map(k=>share[k]*src[k].cost))+imports*15+bat*2+mic*1.2;
  const firmShare=share.nuclear+share.gas+share.oil+share.coal+share.renew*firm;
  const reliab=c100(55+25*mic+12*bat+15*firmShare-imports*150);
  const gen={nuclear:share.nuclear,gas:share.gas,oil:share.oil,coal:share.coal};
  RENEW.forEach((r,k)=>gen[r.id]=share.renew*R[k]);
  return {R,p,firm,quality,bat,mic,renewCap,src,share,imports,co2,cost,reliab,gen};
}
function compute(st){
  const city=CITY[st.city];
  const en=energy(st,city);
  const co2=en.co2;
  const [res,mixed,com]=st.buildings.mix.map(v=>v/100);
  const g=st.buildings.green/100;
  const [sfh,mfh,hr]=st.buildings.live.map(v=>v/100);
  const [,ret,ind,park]=st.buildings.work.map(v=>v/100);
  const retro=st.buildings.retro/100, newStd=st.buildings.newStd/100;
  const D=sfh*1+mfh*3.5+hr*8;
  const Mx=c01(mixed*1.6+ret*com*1.2);
  const balance=1-Math.min(1,Math.abs((res+mixed*.5)-.6)*2.5);
  const parkLand=com*park*(1-g), indLand=com*ind*(1-g);

  const T=st.transport.mix.map(v=>v/100);
  const tw=id=>RANKW[st.transport.tech.indexOf(id)];
  const effA=c01(.4+.07*D+.45*Mx), effB=c01(.35+D/7), effR=c01(.1+D/7);
  let active=(T[0]+T[1])*effA, transit=T[3]*effB+T[4]*effR;
  let car=Math.max(0,1-active-transit);
  const shift=car*.3*tw('scooter')+car*.45*tw('bike')*Math.min(1,T[1]*6);
  active+=shift; car-=shift;
  const evAdopt=.1+1.2*tw('ev')+.5*tw('av');
  const carMult=1+.6*tw('av');

  const canopy=st.green.canopy, roofs=st.green.roofs;
  const [gp,gh,gf]=st.green.mix.map(v=>v/100);
  const coolCut=(1-.12*roofs/100*city.heat)*(1-.18*canopy/60*city.heat);
  const effic=(1-.22*retro-.12*newStd);
  const heatPump=city.cold*1.6*(.7*retro+.3*newStd);
  const elecUse=6.5*(1.25-.05*D)*coolCut*effic+heatPump*.35+car*evAdopt*2;
  const em={power:elecUse*co2/1000, heating:city.cold*2.2*(1-.75*retro)*(1-.3*newStd)*(1.2-.05*D),
    cars:4.2*car*carMult*(1-evAdopt), transit:.6*transit*(.3+.7*co2/820), trips:.9*(1-2*tw('hsr')), industry:indLand*8};
  const total=sum(Object.values(em));

  const climate=c100(100-(total-.8)*11);
  const eAff=c100(100-(en.cost-4.5)*8);
  const hAff=c100(35+7*D-25*(city.land-1)+15*Mx-120*parkLand-30*g);
  const infra=T[0]*.2+T[1]*.25+T[2]+T[3]*.6+T[4]*1.5;
  const tAff=c100(100-35*infra-40*car);
  const techCost=30*(tw('av')+tw('hsr')*1.1+tw('ev')*.4+tw('scooter')*.1);
  const afford=c100((eAff+hAff+tAff)/3-techCost*.5-roofs*.1-canopy*.08-retro*6-newStd*3+8+(city.cold+city.heat)*4*(retro+newStd));

  const aq=c100(100-en.gen.coal*90-en.gen.oil*70-en.gen.gas*30-en.imports*20-car*35-indLand*150-city.cold*20*(1-retro));
  const move=c100(active*140+Mx*30+transit*40);
  const greenAccess=c100(g*170*(gp+.5*gh+.3*gf)+canopy*1.1);
  const daily=c100(55+balance*25-parkLand*200-Math.max(0,D-6.5)*10+sfh*10+tw('bike')*40+tw('hsr')*20+tw('av')*15+retro*8);
  const live=c100(.3*aq+.25*move+.25*greenAccess+.2*daily);

  const biodiv=c100(8+g*gh*420+g*gp*90+g*gf*40+canopy*.9+roofs*.2);
  const heatRes=c100(25+canopy*1.3+roofs*.35+g*70-parkLand*120+retro*10);
  const floodRes=c100(25+g*110+roofs*.45+canopy*.4-T[2]*20-parkLand*100+en.mic*15);
  const nature=c100(.3*biodiv+.2*heatRes+.2*floodRes+.3*en.reliab);

  const scores={climate,afford,live,nature};
  const overall=(climate+afford+live+nature)/4;
  return {en,D,Mx,balance,parkLand,indLand,g,active,transit,car,evAdopt,em,total,scores,overall,aq,biodiv,heatRes,floodRes,
    tw,T,city,canopy,roofs,gp,gh,gf,sfh,hr,retro,newStd};
}

  /* ---------- model-table map: a white massing model with zoning colors projected onto it ---------- */
  mapLayout(st){

    const built=cells.filter(c=>!c.use).sort((a,b)=>a.d-b.d);
    const [res,mixed,com]=st.buildings.mix, [a1,b1,c1]=st.buildings.live, [o,r,i2,p]=st.buildings.work;

    const tail=comCells.slice(wk[0]),uses=tail.map(c=>c.use);tail.sort((a,b)=>a.r3-b.r3).forEach((c,k)=>c.use=uses[k]);

    const boxes=[];
    cells.forEach(c=>{const f=Math.max(.45,1.25-c.d*.9);const add=(x0,y0,w,dd,h)=>boxes.push({u:c.i+x0,v:c.j+y0,w,d:dd,h,use:c.use,seed:Math.floor(c.r*1e6)+Math.round(x0*100)*7+Math.round(y0*100)*13});
      switch(c.use){

        case 'mid':add(.15,.15,.7,.28,(20+c.r*10)*f);add(.15,.57,.7,.28,(18+c.r2*10)*f);break;
        case 'tower':add(.25,.25,.5,.5,(55+c.r*45)*f);break;
        case 'mixed':add(.14,.14,.72,.72,(26+c.r*16)*f);break;
        case 'office':add(.22,.22,.56,.56,(70+c.r*70)*f);if(c.r2>.5)add(.14,.62,.3,.24,14);break;

        case 'industrial':add(.1,.15,.8,.7,13+c.r*4);break;
      }});
    const roofs=st.green.roofs/100,sol=c01(M.en.gen.solar/.5)*.55;
    boxes.forEach(b=>{const r1=(hash(b.seed)%1000)/1000,r2=(hash(b.seed+5)%1000)/1000;b.green=b.use!=='house'&&b.use!=='industrial'&&r1<roofs;b.solar=!b.green&&r2<sol;});

  drawMap(t){
    this.mapLayout(S);
    const c=this.ctx,{A,B,cells,boxes}=this.map;
    const tw=86,th=34,ox=500-(A/2-B/2)*tw/2,oy=244-(A/2+B/2)*th/2;

    cells.forEach(cl=>{if(cl.use!=='park'&&cl.use!=='habitat')return;const n=cl.use==='habitat'?9:5;for(let k=0;k<n;k++){const a=(hash(cl.i*31+cl.j*7+k)%100)/100,b=(hash(cl.j*17+cl.i*3+k*5+1)%100)/100;
      const [x,y]=P(cl.i+.18+a*.64,cl.j+.18+b*.64);const r=cl.use==='habitat'?4.5:4;c.fillStyle=cl.use==='habitat'?'#1E5A33':'#3E9A4E';c.beginPath();c.arc(x,y-r,r,0,7);c.fill();}});
    if(T[4]>0){c.save();c.lineCap='round';const lines=[[[0,B/2],[A,B/2]],[[A/2,0],[A/2,B]]];
      lines.forEach(([a,b])=>{const [x1,y1]=P(...a),[x2,y2]=P(...b);c.strokeStyle='rgba(111,179,255,.25)';c.lineWidth=7;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.strokeStyle='#6FB3FF';c.lineWidth=2;c.stroke();});
      const nTr=T[4]>.15?2:1;for(let k=0;k<nTr;k++)lines.forEach(([a,b],li)=>{const f=((t*.06+k*.5+li*.25)%1);const u=a[0]+(b[0]-a[0])*f,v=a[1]+(b[1]-a[1])*f;
        for(let s=0;s<4;s++){const [x,y]=P(u-(li?0:s*.18),v-(li?s*.18:0));c.fillStyle='#DDEEFF';c.beginPath();c.arc(x,y,2.6,0,7);c.fill();}});c.restore();}
    const modes=[['#FFC857',Math.round(M.car*110),.05],['#FF6B5B',T[3]>0?Math.round(T[3]*60)+2:0,.035],['#7CF29A',Math.round(M.active*90),.02]];
    let di=0;
    modes.forEach(([col,n,spd])=>{for(let k=0;k<n&&di<this.mapDots.length;k++,di++){const [a,b,s]=this.mapDots[di];const along=s>.5;const dir=b>.5?1:-1;
      const f=((a+dir*spd*t*(1+b))%1+1)%1;let u,v;if(along){v=Math.round(b*B);u=f*A;}else{u=Math.round(a*A);v=f*B;}
      const off=dir>0?.06:-.06;const [x,y]=P(u+(along?0:off),v+(along?off:0));c.fillStyle=col;c.globalAlpha=.25;c.beginPath();c.arc(x,y,4,0,7);c.fill();c.globalAlpha=1;c.beginPath();c.arc(x,y,1.7,0,7);c.fill();}});

      poly([P(u0,v1),P(u1,v1),P(u1,v1,h),P(u0,v1,h)],mixHex('#C2CBD4',z,.12));
      poly([P(u1,v0),P(u1,v1),P(u1,v1,h),P(u1,v0,h)],mixHex('#98A4B0',z,.12));
      poly([P(u0,v0,h),P(u1,v0,h),P(u1,v1,h),P(u0,v1,h)],b.green?'#58B866':b.solar?'#2B4F8A':mixHex('#F4F6F8',z,.55));

    });
    const edge=[];if(G.coal>.005)edge.push(['#4A4540',G.coal]);if(G.oil>.005)edge.push(['#A0522D',G.oil]);if(G.gas>.005)edge.push(['#8E959C',G.gas]);if(G.nuclear>.005)edge.push(['#8A6FC9',G.nuclear]);

    c.fillStyle='rgba(233,240,247,.75)';c.font='500 12px "IBM Plex Mono",monospace';c.fillText('MODEL TABLE · LAND USE PROJECTED ON BUILDINGS',20,428);

let infoFor=null;
function legend(items,values,onInfo){
  const lg=el('div','legend');const vals=[];
  items.forEach((it,i)=>{const r=el('div','lg');r.innerHTML=`<span class="chip" style="background:${it.color}"></span><span class="nm">${esc(it.name)}</span><span class="val">${values[i]}%</span>`;
    r.append(infoButton(it,onInfo));lg.append(r);vals.push(r.querySelector('.val'));});
  lg.update=v=>v.forEach((x,i)=>vals[i].textContent=x+'%');
  return lg;
}
function infoButton(it,onInfo){const b=el('button','info-btn','i');b.type='button';b.dataset.for=it.id||it.name;b.setAttribute('aria-label',`About ${it.name}`);b.setAttribute('aria-pressed',infoFor===it?'true':'false');
  b.onclick=()=>onInfo(it);return b;}
function makeModel(values,onChange){
  const n=values.length;
  const cum=()=>{const c=[];let s=0;for(let i=0;i<n-1;i++){s+=values[i];c.push(s)}return c};
  function set(k,p){const c=cum();const lo=k>0?c[k-1]:0,hi=k<n-2?c[k+1]:100;const v=Math.round(Math.max(lo,Math.min(hi,p)));
    values[k]=v-lo;values[k+1]=hi-v;onChange(values);}
  function pick(k,dir){const c=cum();let a=k,b=k;while(a>0&&c[a-1]===c[k])a--;while(b<n-2&&c[b+1]===c[k])b++;return dir<0?a:b;}
  return {cum,set,pick};
}
const KEYDIR={ArrowLeft:-1,ArrowDown:-1,ArrowRight:1,ArrowUp:1};

    h.addEventListener('keydown',e=>{const dir=KEYDIR[e.key];if(!dir)return;e.preventDefault();const k=model.pick(i,dir);model.set(k,model.cum()[k]+dir*(e.shiftKey?5:1));hs[k].focus();});

function rankList(items,order,onChange,onInfo,hasExtra){
  const by=Object.fromEntries(items.map(i=>[i.id,i]));
  const ol=el('ol','rank');
  function row(id){const it=by[id];const li=el('li','rk');li.dataset.id=id;
    li.innerHTML=`<span class="num"></span><button class="grip" type="button" aria-label="Drag ${esc(it.name)} to reorder"></button><div class="t"><b>${esc(it.name)}</b><span>${esc(it.hint)}</span></div><div class="acts"><button class="mini up" type="button" aria-label="Move ${esc(it.name)} up">▲</button><button class="mini dn" type="button" aria-label="Move ${esc(it.name)} down">▼</button></div>${hasExtra?'<div class="ex"></div>':''}`;

  order.forEach(id=>ol.append(row(id)));

    [...ol.children].forEach((li,i)=>{li.querySelector('.num').textContent=i+1;li.querySelector('.up').disabled=i===0;li.querySelector('.dn').disabled=i===ids.length-1;});onChange(order);}
  function move(id,dir){const li=ol.querySelector(`[data-id="${id}"]`);if(dir<0&&li.previousElementSibling)ol.insertBefore(li,li.previousElementSibling);
    else if(dir>0&&li.nextElementSibling)ol.insertBefore(li.nextElementSibling,li);sync();li.querySelector(dir<0?'.up':'.dn').focus();}
  let drag=null;
  ol.addEventListener('pointerdown',e=>{const g=e.target.closest('.grip');if(!g)return;e.preventDefault();ol.setPointerCapture(e.pointerId);drag=g.closest('li');drag.classList.add('lift')});
  ol.addEventListener('pointermove',e=>{if(!drag)return;const prev=drag.previousElementSibling,next=drag.nextElementSibling;
    if(prev){const r=prev.getBoundingClientRect();if(e.clientY<r.top+r.height/2){ol.insertBefore(drag,prev);sync();return}}
    if(next){const r=next.getBoundingClientRect();if(e.clientY>r.top+r.height/2){ol.insertBefore(next,drag);sync();}}});
  const end=()=>{if(drag){drag.classList.remove('lift');drag=null}};ol.addEventListener('pointerup',end);ol.addEventListener('pointercancel',end);
  [...ol.children].forEach((li,i)=>{li.querySelector('.num').textContent=i+1;li.querySelector('.up').disabled=i===0;li.querySelector('.dn').disabled=i===order.length-1;});

}
function gauge(v,max){const f=c01(v/max),a=Math.PI*(1-f);const x=31+24*Math.cos(a),y=32-24*Math.sin(a);
  const col=f<.35?'#3FA66B':f<.6?'#E0A526':'#D0574B';
  return `<svg viewBox="0 0 62 36" aria-hidden="true"><path d="M7 32 A24 24 0 0 1 55 32" fill="none" stroke="var(--line)" stroke-width="6"/><path d="M7 32 A24 24 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${col}" stroke-width="6"/><line x1="31" y1="32" x2="${(31+20*Math.cos(a)).toFixed(1)}" y2="${(32-20*Math.sin(a)).toFixed(1)}" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/><circle cx="31" cy="32" r="3" fill="var(--ink)"/></svg>`;}
function sourceExtra(id){

   <span class="supply" style="--sc:${it.color}" title="Supplies ${Math.round(sh*100)}% of a possible ${Math.round(cap*100)}%"><span class="sb"><i style="width:${sh*100}%"></i><s style="left:${sh*100}%;width:${Math.max(0,cap-sh)*100}%"></s></span><span class="c">${Math.round(sh*100)}%</span></span>`;
}

function slider(id,value,max,startVal,goal,onChange){

/* ---------- residents react ---------- */
function voices(m){
  const V=[],E=m.en,T=m.T,c=m.city;
  const add=(w,who,mood,text)=>V.push({w,who,mood,text});
  if(m.parkLand<.012)add(30,'Commuter','meh','Very little parking available. I guess I’ll take the bus.');
  else if(m.parkLand>.07)add(m.parkLand*500,'Shop owner','bad','Plenty of parking downtown, but the lots bake in the sun and nobody walks past my store.');
  if(m.D>5)add(m.D*6,'Young family','good','Lots of housing available. We found a place near school without a long commute.');
  else if(m.D<2.4)add(40,'Nurse','bad','Rents keep climbing and there’s nothing near the hospital. I drive an hour each way.');
  const smog=E.gen.coal+E.gen.oil+E.gen.gas*.4+m.car*.2;
  if(smog>.35)add(smog*90,'Grandparent','bad','Hazy skies again. My doctor says to stay inside on days like this.');
  else if(smog<.15)add(35,'Runner','good','You can see the hills from downtown now. The air feels so clean.');
  if(E.imports>.01)add(70,'Factory manager','bad','We’re buying power from other states at crazy prices. Our bills went way up.');
  if(E.reliab<60)add(60-E.reliab+20,'Night-shift worker','bad','The power flickered again during last night’s calm spell.');
  if(E.mic>=.4)add(E.mic*60,'Neighbor','good','A storm knocked out the main grid, but our block’s microgrid kept the lights on.');
  if(E.share.renew>.75)add(E.share.renew*45,'Engineer','good',`${Math.round(E.share.renew*100)}% of our power is renewable now. Not bad for ${c.name}!`);
  if(E.gen.coal>.04)add(E.gen.coal*300,'Teacher','bad','Kids near the coal plant keep missing school with asthma.');
  if(m.car>.55)add(m.car*55,'Delivery driver','bad','Stuck in traffic for 40 minutes on a 3-mile trip.');
  if(T[1]>.1&&m.tw('bike')>=.2)add(T[1]*250,'Student','good','Biked to class on the new protected lane. Grabbed a share bike on the way back.');
  else if(m.tw('bike')>=.26&&T[1]<.05)add(30,'Student','meh','There are share bikes everywhere, but riding next to the trucks is terrifying.');
  if(T[4]>.12&&m.D<3)add(40,'Train conductor','meh','The new train is fast, but most seats are empty. Not many people live near the stations.');
  else if(m.transit>.25)add(m.transit*110,'Office worker','good','The train was packed, but I was downtown in 12 minutes.');
  if(m.tw('av')>=.26)add(28,'Retiree','meh','Empty robotaxis keep circling my block waiting for riders.');
  if(m.tw('hsr')>=.26)add(28,'College student','good','Took the fast train home for the weekend instead of flying. Faster than airport security!');
  if(m.canopy<18&&c.heat>.5)add((18-m.canopy)*5,'Mail carrier','bad','The sidewalk is too hot to walk on by noon.');
  else if(m.canopy>=30)add(m.canopy,'Dog walker','good','The shady streets made this week’s heat wave bearable.');
  if(m.g*m.gh>.05)add(m.g*m.gh*600,'Kid','good','I saw a deer by the creek on the way to school!');
  if(m.g*m.gf>.025)add(m.g*m.gf*800,'Chef','good','Bought tomatoes grown two blocks from my restaurant.');
  if(m.roofs>=40)add(m.roofs*.6,'Apartment tenant','good','Our roof garden has bees now, and the top floor stays cool.');
  if(m.g<.08)add(30,'Parent','bad','The nearest playground is a 20-minute drive.');
  if(m.retro>=.5&&c.cold>.3)add(m.retro*50,'Landlord','good','The old building finally has real insulation and heat pumps. No more drafty winters.');
  else if(m.retro<.2&&c.cold>.5)add(35,'Renter','bad','Our old apartment leaks heat everywhere and the gas bill is huge.');
  if(m.scores.afford<40)add(45-m.scores.afford+20,'City budget office','bad','This plan costs a lot. Taxes and bills are going up.');
  if(m.Mx>.4)add(m.Mx*50,'Barista','good','Everyone in the apartments upstairs comes down for coffee. Great for business.');
  return V.sort((a,b)=>b.w-a.w).slice(0,5);
}

function feedback(m){
  const city=m.city.name, wins=[], fixes=[], E=m.en, T=m.T;
  const P=v=>Math.round(v*100)+'%';
  if(E.share.coal>.03)fixes.push([E.share.coal*300,`Coal still makes ${P(E.share.coal)} of your power. Move it to the bottom of your list so other sources go first.`]);
  if(E.share.oil>.02)fixes.push([E.share.oil*250,`Oil supplies ${P(E.share.oil)} of your power. It is both the most expensive and one of the dirtiest options.`]);
  if(E.share.gas>.25)fixes.push([E.share.gas*120,`Natural gas fills ${P(E.share.gas)} of demand and is the biggest source of power-sector CO₂ in your plan.`]);
  if(E.imports>.01)fixes.push([E.imports*400,`Your sources only cover ${P(1-E.imports)} of demand. The rest is imported at high prices. Add more storage so renewables can supply more.`]);
  if(E.renewCap<.65)fixes.push([(.65-E.renewCap)*150,`Renewables can only supply ${P(E.renewCap)} with your storage. More batteries, microgrids, or steady renewables like geothermal and hydro raise that limit.`]);
  const badFit=RENEW.map((r,k)=>[r,E.R[k],E.p[k]]).filter(([,s,p])=>s>.1&&p<.4);
  if(badFit.length)fixes.push([45,`${badFit.map(([r])=>r.name).join(' and ')} ${badFit.length>1?'are':'is'} a poor fit for ${city}, which makes your renewables expensive.`]);
  if(m.car>.5)fixes.push([m.car*80,`About ${P(m.car)} of trips still happen by car. Give more street space to buses, bikes and sidewalks, or build denser homes so transit has riders.`]);
  if(T[4]>.15&&m.D<3)fixes.push([40,`Rail gets ${P(T[4])} of the street, but with mostly single-family homes too few people live near stations to fill the trains.`]);
  if(m.tw('bike')>=.2&&T[1]<.06)fixes.push([35,`Bikeshare is near the top of your list, but bike lanes get only ${P(T[1])} of the street. Without safe lanes, few people ride.`]);
  if(m.parkLand>.04)fixes.push([m.parkLand*700,`Parking lots cover about ${P(m.parkLand)} of the city. That land traps heat and could hold homes or parks.`]);
  if(m.canopy<20&&m.city.heat>.5)fixes.push([(20-m.canopy)*3,`Tree canopy is only ${m.canopy}%. In ${city}’s heat, shade trees are one of the cheapest ways to protect people.`]);
  if(m.g<.1)fixes.push([(0.1-m.g)*400,`Only ${P(m.g)} of the land is green space, so many residents live far from a park.`]);
  if(m.retro<.35&&m.city.cold>.3)fixes.push([m.city.cold*60,`Only ${P(m.retro)} of older buildings are retrofitted. Gas heating in old buildings is a big source of CO₂ in a city with cold winters.`]);
  if(m.tw('av')>=.26)fixes.push([25,`Ranking self-driving cars so high adds driving: empty cars cruising between rides mean more traffic and emissions.`]);
  if(m.scores.afford<45)fixes.push([60-m.scores.afford,`This plan is expensive. The biggest costs are ${E.cost>9?'electricity':'transport infrastructure and car ownership'}.`]);

  if(E.co2<120)wins.push([(120-E.co2)/2,`Your grid emits about ${Math.round(E.co2)} g CO₂ per kWh, cleaner than almost every country’s grid today.`]);
  if(E.share.renew>.7)wins.push([E.share.renew*50,`${P(E.share.renew)} of your power is renewable, backed by enough storage to keep the lights on.`]);
  if(E.mic>=.4)wins.push([E.mic*40,`Microgrids in ${P(E.mic)} of neighborhoods keep homes powered through storms and heat waves.`]);
  if(m.active>.3)wins.push([m.active*120,`About ${P(m.active)} of trips are on foot, by bike or by scooter. That is good for health and for the air.`]);
  if(m.transit>.22)wins.push([m.transit*120,`Transit carries about ${P(m.transit)} of trips, helped by homes dense enough to fill buses and trains.`]);
  if(m.retro>=.5)wins.push([m.retro*50,`Retrofitting ${P(m.retro)} of older buildings cuts heating and cooling energy across the city.`]);
  if(m.canopy>=30)wins.push([m.canopy,`A ${m.canopy}% tree canopy cools streets and cuts air-conditioning demand.`]);
  if(m.roofs>=40)wins.push([m.roofs*.6,`Green roofs on ${m.roofs}% of buildings soak up rain and give pollinators places to live.`]);
  if(m.g*m.gh>.06)wins.push([m.g*m.gh*500,`Protected habitat covers about ${P(m.g*m.gh)} of the city, enough to keep birds and other wildlife in town.`]);
  if(m.Mx>.4)wins.push([m.Mx*60,`Plenty of mixed-use blocks put shops and jobs a short walk from home.`]);
  if(m.tw('hsr')>=.26)wins.push([30,`Prioritizing high-speed rail replaces many short flights to nearby cities.`]);
  if(m.parkLand<.015)wins.push([25,`You kept parking lots to a minimum, which frees land for homes, shops and parks.`]);
  const top=(a,n)=>a.sort((x,y)=>y[0]-x[0]).slice(0,n).map(x=>x[1]);
  return {wins:top(wins,4),fixes:top(fixes,4)};
}

function renderResults(panel){
  const m=M,b=BASE,[g,gc]=grade(m.overall),[bg]=grade(b.overall);
  panel.append(el('div','eyebrow',`Report · ${esc(m.city.name)} in 2050`));
  const head=el('div','grade-row');
  head.innerHTML=`<div class="grade" style="--gcol:${gc}">${g}</div><div><h2 style="margin:0">${g==='A'?'A model city':g==='B'?'A strong plan':g==='C'?'A solid start':g==='D'?'Needs more work':'Back to the drawing board'}</h2>
    <p class="lede" style="margin:4px 0 0">Sustainability score ${Math.round(m.overall)} out of 100. ${esc(m.city.name)} started at ${Math.round(b.overall)} (${bg}). Emissions went from ${b.total.toFixed(1)} to ${m.total.toFixed(1)} tonnes of CO₂ per resident each year.</p></div>`;
  panel.append(head);
  const tw=el('div','tblwrap');
  const rows=METERS.map(mt=>{const v=Math.round(m.scores[mt.k]),o=Math.round(b.scores[mt.k]),d=v-o;
    return `<tr><td>${mt.name}<div class="muted">${mt.desc}</div></td><td>${o}</td><td><b>${v}</b></td><td style="color:var(--${d>0?'good':d<0?'bad':'ink-2'})">${d>0?'+':d<0?'−':''}${Math.abs(d)}</td></tr>`}).join('');
  tw.innerHTML=`<table class="cmp"><thead><tr><th>Score</th><th>Today</th><th>Your plan</th><th>Change</th></tr></thead><tbody>${rows}</tbody></table>`;
  panel.append(tw);
  const G=m.en.gen,sh=m.en.share;
  const gen=[['Solar','#E9B308',G.solar],['Wind','#6CB8DC',G.wind],['Geothermal','#C8643A',G.geo],['Wave','#2BA3A0',G.wave],['Hydro','#2F6DB5',G.hydro],
    ['Nuclear','#8A6FC9',sh.nuclear],['Gas','#8E959C',sh.gas],['Oil','#A0522D',sh.oil],['Coal','#4A4540',sh.coal],['Imports','#D0574B',m.en.imports]].filter(x=>x[2]>.004);
  const gm=el('div');gm.style.marginTop='18px';
  gm.innerHTML=`<h3 style="font-size:1.05rem">Where your electricity comes from</h3><div class="stack">${gen.map(([,c,v])=>`<span style="width:${v*100}%;background:${c}"></span>`).join('')}</div>
    <div class="legend">${gen.map(([n,c,v])=>`<div class="lg"><span class="chip" style="background:${c}"></span><span class="nm">${n}</span><span class="val">${Math.round(v*100)}%</span></div>`).join('')}</div>`;
  panel.append(gm);
  const parts=[['power','Electricity','#E9B308'],['heating','Gas heating','#C8643A'],['cars','Cars','#6E757C'],['transit','Buses and trains','#2F6DB5'],['trips','Trips to other cities','#8A6FC9'],['industry','Industry','#7B5EA7']];
  const em=el('div');em.style.marginTop='18px';
  em.innerHTML=`<h3 style="font-size:1.05rem">Where your ${m.total.toFixed(1)} tonnes come from</h3><div class="stack">${parts.map(([k,,c])=>`<span style="width:${m.em[k]/m.total*100}%;background:${c}"></span>`).join('')}</div>
    <div class="legend">${parts.map(([k,n,c])=>`<div class="lg"><span class="chip" style="background:${c}"></span><span class="nm">${n}</span><span class="val">${m.em[k].toFixed(1)} t</span></div>`).join('')}</div>`;
  panel.append(em);
  const fb=feedback(m),f=el('div','fb');
  f.innerHTML=`<div><h3>What works</h3><ul>${(fb.wins.length?fb.wins:['Nothing stands out yet. Try changing one chapter at a time and watch the score.']).map(t=>`<li style="--c:var(--good)">${esc(t)}</li>`).join('')}</ul></div>
    <div><h3>What to try next</h3><ul>${(fb.fixes.length?fb.fixes:['No major weak spots. Try another city to see how geography changes the best plan.']).map(t=>`<li style="--c:var(--warn)">${esc(t)}</li>`).join('')}</ul></div>`;
  panel.append(f);
  panel.append(el('p','muted','Scores come from a simplified model built for this game. Emission factors for power sources use published lifecycle estimates; everything else is a rough estimate meant to show trade-offs, not to predict a real city.'));
  const nav=el('div','navrow');
  const back=el('button','btn','Revise my plan');back.type='button';back.onclick=()=>go(0);
  const nc=el('button','btn primary','Try another city');nc.type='button';nc.onclick=()=>showStart();
  nav.append(back,nc);panel.append(nav);
}

function showStart(){
  const st=$('#start');$('#main').hidden=true;st.hidden=false;
  st.innerHTML=`<h1>Plan a city that can thrive in 2050</h1><p>Pick a city. You will choose its energy, buildings, streets and green space, and watch the city change as you go. Residents will tell you what they think, and at the end you get a sustainability report.</p>`;
  const grid=el('div','cities');
  CITIES.forEach(c=>{const b=el('button','cityc');b.type='button';
    const tr=[['Sun',c.pot.solar/1.3],['Wind',c.pot.wind/1.1],['Rivers',c.pot.hydro/1.4],['Geothermal',c.pot.geo],['Waves',c.pot.wave],['Heat',c.heat],['Cold',c.cold],['Flooding',c.flood],['Land cost',c.land/1.5]];
    b.innerHTML=`<b>${esc(c.name)}</b><span class="tg">${esc(c.tag)}</span><div class="traits">${tr.map(([n,v])=>`<span>${n}</span><i style="--w:${Math.round(c01(v)*100)}%"></i>`).join('')}</div>`;
    b.onclick=()=>startCity(c.id);grid.append(b);});
  st.append(grid);
  if(S){const back=el('button','btn',`Keep planning ${esc(CITY[S.city].name)}`);back.type='button';back.style.justifySelf='start';back.onclick=()=>{st.hidden=true;$('#main').hidden=false};st.append(back);}
}
function startCity(id){S=newState(id);begin();}
function begin(){
  BASE=compute(newState(S.city));
  $('#start').hidden=true;$('#main').hidden=false;
  $('#stageTag').textContent=`${CITY[S.city].name} in 2050`;
  lastVoices='';renderReport();update();renderTop();renderPanel();scene.key='';scene.mkey='';scene.draw(scene.now());
}
function setView(v){VIEW=v;$('#vStreet').setAttribute('aria-pressed',String(v==='street'));$('#vMap').setAttribute('aria-pressed',String(v==='map'));
  $('#mapLegend').hidden=v!=='map';scene.draw(scene.now());if(S)save();}
$('#mapLegend').innerHTML=[['Homes','#E1AE22'],['Mixed-use','#E07B2E'],['Office & retail','#C8443A'],['Industrial','#7B5EA7'],['Parking','#56606B'],['Parks','#6DB865'],['Habitat','#2F7A45'],['Farms','#B3BE3A'],['Green roofs','#58B866'],['Solar roofs','#2B4F8A']]
  .map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')+[['Cars','#FFC857'],['Buses','#FF6B5B'],['Walking & biking','#7CF29A'],['Trains','#6FB3FF']].map(([n,c])=>`<span><i class="dot" style="background:${c}"></i>${n}</span>`).join('');
$('#vStreet').onclick=()=>setView('street');$('#vMap').onclick=()=>setView('map');
$('#cityBtn').onclick=showStart;
$('#restart').onclick=()=>{if(S)startCity(S.city)};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>scene.draw(scene.now()));
new MutationObserver(()=>scene.draw(scene.now())).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
reduceMotion.addEventListener('change',()=>scene.loop());

// Before a city is chosen, the scene previews San Francisco so the page is never empty.
const _draw=scene.draw.bind(scene);let preview=null;
scene.draw=function(t){if(!S){if(!preview)preview=newState('sf');S=preview;M=M||compute(preview);_draw(t);S=null;return;}_draw(t);};
function boot(data){
  S=(data&&data.S)||load();
  if(data&&data.VIEW)VIEW=data.VIEW;
  if(!S){M=compute(newState('sf'));BASE=M;showStart();renderTop();}
  else begin();
  setView(VIEW);
  scene.resize();scene.loop();
}
window.claude?.hot?.snapshot?.(()=>({S,VIEW}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
