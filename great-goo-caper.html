<style>
/* Layout: a stack of printed comic pages on a halftone night-blue table; each page is a 2-column panel grid. Single deliberate look (paper + ink) in both themes. */
:root {
  --table: #1b2550;
  --table-dot: #26336b;
  --paper: #fffdf4;
  --ink: #1b1b1f;
  --caption: #ffe45c;
  --shout: #fff7b0;
  --robot: #dff4ff;
  --red: #d7263d;
  --blue: #1e5bd8;
  --muted: #c9d2f2;
  --display: "Bangers", "Impact", "Arial Black", sans-serif;
  --body: "Comic Neue", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  color-scheme: light;
}
body {
  background-color: var(--table);
  background-image: radial-gradient(var(--table-dot) 1.6px, transparent 1.7px);
  background-size: 14px 14px;
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.book { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px; }
.intro { color: var(--muted); text-align: center; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.intro b { font-family: var(--display); font-weight: 400; letter-spacing: .08em; font-size: 20px; color: var(--paper); }
.page {
  background: var(--paper);
  border: 3px solid var(--ink);
  box-shadow: 9px 9px 0 #0b1024;
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.page-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.page-head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(20px, 3.4vw, 28px); letter-spacing: .04em; text-wrap: balance; }
.page-head span { font-family: var(--display); letter-spacing: .12em; font-size: 15px; color: #5a5a66; white-space: nowrap; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.panel {
  position: relative; container-type: inline-size;
  border: 3px solid var(--ink); background: #fff;
  aspect-ratio: 4 / 3; overflow: hidden; max-width: 100%;
}
.panel.w2 { grid-column: span 2; aspect-ratio: 8 / 3; }
.panel.cover { aspect-ratio: 8 / 9.5; }
.panel img { display: block; width: 100%; height: 100%; object-fit: cover; background: #dfe6f2; }
.sfx { position: absolute; font-family: var(--display); line-height: 1; letter-spacing: .04em; white-space: nowrap; paint-order: stroke fill; transform-origin: 0 100%; pointer-events: none; }
.cap {
  position: absolute; left: 0; top: 0; max-width: 62%;
  background: var(--caption); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
  padding: .35em .6em; font-weight: 700; font-size: clamp(10px, 3.3cqw, 16px); line-height: 1.2;
}
.w2 .cap { font-size: clamp(10px, 1.75cqw, 16px); max-width: 55%; }
.bubble {
  position: absolute; box-sizing: border-box; background: #fff; border: 2.5px solid var(--ink); border-radius: 48% / 42%;
  padding: .55em .8em; text-align: center; font-weight: 700; line-height: 1.18;
  font-size: clamp(10px, 3.5cqw, 17px);
}
.w2 .bubble { font-size: clamp(10px, 1.85cqw, 17px); }
.bubble.shout { background: var(--shout); border-width: 3.5px; border-radius: 14px; text-transform: uppercase; font-family: var(--display); font-weight: 400; letter-spacing: .05em; font-size: clamp(12px, 4.6cqw, 22px); }
.w2 .bubble.shout { font-size: clamp(12px, 2.6cqw, 24px); }
.bubble.robot { background: var(--robot); border-radius: 6px; text-transform: uppercase; letter-spacing: .06em; font-family: ui-monospace, "Courier New", monospace; }
.bubble::before, .bubble::after { content: ""; position: absolute; width: 0; height: 0; border-style: solid; }
.bubble.tl::before, .bubble.tc::before, .bubble.tr::before { top: 100%; border-width: 16px 9px 0 9px; border-color: var(--ink) transparent transparent transparent; }
.bubble.tl::after, .bubble.tc::after, .bubble.tr::after { top: 100%; margin-top: -3.5px; border-width: 13px 6.5px 0 6.5px; border-color: #fff transparent transparent transparent; }
.bubble.shout.tl::after, .bubble.shout.tc::after, .bubble.shout.tr::after { border-top-color: var(--shout); }
.bubble.robot.tl::after, .bubble.robot.tc::after, .bubble.robot.tr::after { border-top-color: var(--robot); }
.bubble.tl::before { left: 16%; } .bubble.tl::after { left: calc(16% + 2.5px); }
.bubble.tc::before { left: calc(50% - 9px); } .bubble.tc::after { left: calc(50% - 6.5px); }
.bubble.tr::before { right: 16%; } .bubble.tr::after { right: calc(16% + 2.5px); }
.cover-title { position: absolute; left: 0; right: 0; top: 2.5%; text-align: center; pointer-events: none; }
.cover-title .kicker { display: inline-block; background: var(--ink); color: var(--caption); font-family: var(--display); letter-spacing: .14em; font-size: 3.4cqw; padding: .1em .8em; transform: rotate(-2deg); }
.cover-title h1 {
  margin: .1em 0 0; font-family: var(--display); font-weight: 400; line-height: .92;
  font-size: 11.5cqw; color: var(--caption); letter-spacing: .02em;
  -webkit-text-stroke: .6cqw var(--ink); paint-order: stroke fill;
  text-shadow: .8cqw .8cqw 0 var(--ink); text-wrap: balance;
}
.cover-title .sub { margin-top: .4em; font-family: var(--display); font-size: 5cqw; color: #fff; -webkit-text-stroke: .35cqw var(--ink); paint-order: stroke fill; letter-spacing: .04em; }
.badge { position: absolute; left: 4%; top: 31%; background: #fff; border: 3px solid var(--ink); font-family: var(--display); font-size: 2.6cqw; line-height: 1; padding: .4em .5em; text-align: center; transform: rotate(-4deg); }
.badge b { display: block; font-size: 2em; font-weight: 400; color: var(--red); }
.end-note { color: var(--muted); text-align: center; font-size: 14px; }
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
  .panel.w2 { grid-column: span 1; aspect-ratio: 8 / 3.6; }
  .panel.cover { aspect-ratio: 8 / 9.5; }
  .page { padding: 10px; }
}
</style>

/* ---------- render ---------- */
const book=document.getElementById('book');
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
const NAMES={winston:'Winston',derek:'Derek',spidey:'Spidey',spin:'Spin',ghost:'Ghost-Spider',goblin:'Green Goblin',rhino:'Rhino',bolt:'Bolt',tracee:'Trace-E',machine:'the Goo-Blaster 3000'};
function art(id, p){
  const who=[...new Set((p.items||[]).map(it=>NAMES[it[0]]).filter(Boolean))];
  const alt=(p.cap?p.cap+' ':'')+(who.length?'Shows '+who.join(', ')+'.':'');
  return `<img src="comic-art/${id}.jpg" alt="${esc(alt)}" loading="lazy">`;
}
function sfx(p, w, h){
  let s='';
  const list=(p.sfx||[]).slice();
  (p.items||[]).forEach(it=>{if(it[0]==='notes')list.push(['♪ ♫ ♪',it[1],it[2],it[3]||30,0,'#1b1b1f']);});
  list.forEach(([t,x,y,size,rot,fill])=>{
    const mid=x>w*0.35&&x<w*0.65;
    s+=`<div class="sfx" style="left:${x/w*100}%;top:${y/h*100}%;font-size:${size/w*100}cqw;-webkit-text-stroke:${size/7/w*100}cqw #1b1b1f;color:${fill};transform:translate(${mid?'-50%':'0'},-82%) rotate(${rot}deg)">${esc(t)}</div>`;
  });
  return s;
}
function overlays(p){
  let s='';
  if(p.cap) s+=`<div class="cap">${esc(p.cap)}</div>`;
  (p.b||[]).forEach(([x,y,w,t,tail,cls])=>{s+=`<div class="bubble ${tail||''} ${cls||''}" style="left:${x}%;top:${y}%;width:${w}%">${esc(t)}</div>`;});
  return s;
}
PAGES.forEach((pg,i)=>{
  const page=document.createElement('section');
  page.className='page';
  const n=i+1;
  if(pg.cover){
    const items=COVER_ITEMS;
    page.innerHTML=`<div class="panel cover" style="aspect-ratio:8/9.5">${art('p1-1',{items})}`+
      `<div class="badge">No.<b>1</b>Nov 2026</div>`+
      `<div class="cover-title"><span class="kicker">WINSTON &amp; DEREK PANG with THE SPIDEY TEAM</span><h1>The Great Goo Caper</h1><div class="sub">A robot! A goblin! A whole lot of confetti!</div></div></div>`;
  } else {
    let html=`<div class="page-head"><h2>${esc(pg.title)}</h2><span>Page ${n} of ${PAGES.length}</span></div><div class="grid">`;
    pg.panels.forEach((p,j)=>{const w=p.w===2?800:400;html+=`<div class="panel${p.w===2?' w2':''}">${art(`p${n}-${j+1}`,p)}${sfx(p,w,300)}${overlays(p)}</div>`;});
    page.innerHTML=html+'</div>';
  }
  book.appendChild(page);
});
const end=document.createElement('p');end.className='end-note';end.textContent='A fan-made comic for the Pang family. Spidey and friends belong to their creators.';book.appendChild(end);
</script>
