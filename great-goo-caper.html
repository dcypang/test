<title>The Great Goo Caper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
<style>
/* Layout: a stack of printed comic pages on a halftone night-blue table; each page is a 2-column panel grid. Single deliberate look (paper + ink) in both themes. */
:root {
  --table: #1b2550;
  --table-dot: #26336b;
  --paper: #fffdf4;
  --ink: #1b1b1f;
  --caption: #ffe45c;
  --shout: #fff7b0;
  --robot: #dff4ff;
  --red: #d7263d;
  --blue: #1e5bd8;
  --muted: #c9d2f2;
  --display: "Bangers", "Impact", "Arial Black", sans-serif;
  --body: "Comic Neue", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  color-scheme: light;
}
body {
  background-color: var(--table);
  background-image: radial-gradient(var(--table-dot) 1.6px, transparent 1.7px);
  background-size: 14px 14px;
  color: var(--ink);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
.book { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px; }
.intro { color: var(--muted); text-align: center; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.intro b { font-family: var(--display); font-weight: 400; letter-spacing: .08em; font-size: 20px; color: var(--paper); }
.page {
  background: var(--paper);
  border: 3px solid var(--ink);
  box-shadow: 9px 9px 0 #0b1024;
  padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
}
.page-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.page-head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(20px, 3.4vw, 28px); letter-spacing: .04em; text-wrap: balance; }
.page-head span { font-family: var(--display); letter-spacing: .12em; font-size: 15px; color: #5a5a66; white-space: nowrap; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.panel {
  position: relative; container-type: inline-size;
  border: 3px solid var(--ink); background: #fff;
  aspect-ratio: 4 / 3; overflow: hidden; max-width: 100%;
}
.panel.w2 { grid-column: span 2; aspect-ratio: 8 / 3; }
.panel.cover { aspect-ratio: 8 / 9.5; }
.panel svg { display: block; width: 100%; height: 100%; }
.cap {
  position: absolute; left: 0; top: 0; max-width: 62%;
  background: var(--caption); border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
  padding: .35em .6em; font-weight: 700; font-size: clamp(10px, 3.3cqw, 16px); line-height: 1.2;
}
.w2 .cap { font-size: clamp(10px, 1.75cqw, 16px); max-width: 55%; }
.bubble {
  position: absolute; box-sizing: border-box; background: #fff; border: 2.5px solid var(--ink); border-radius: 48% / 42%;
  padding: .55em .8em; text-align: center; font-weight: 700; line-height: 1.18;
  font-size: clamp(10px, 3.5cqw, 17px);
}
.w2 .bubble { font-size: clamp(10px, 1.85cqw, 17px); }
.bubble.shout { background: var(--shout); border-width: 3.5px; border-radius: 14px; text-transform: uppercase; font-family: var(--display); font-weight: 400; letter-spacing: .05em; font-size: clamp(12px, 4.6cqw, 22px); }
.w2 .bubble.shout { font-size: clamp(12px, 2.6cqw, 24px); }
.bubble.robot { background: var(--robot); border-radius: 6px; text-transform: uppercase; letter-spacing: .06em; font-family: ui-monospace, "Courier New", monospace; }
.bubble::before, .bubble::after { content: ""; position: absolute; width: 0; height: 0; border-style: solid; }
.bubble.tl::before, .bubble.tc::before, .bubble.tr::before { top: 100%; border-width: 16px 9px 0 9px; border-color: var(--ink) transparent transparent transparent; }
.bubble.tl::after, .bubble.tc::after, .bubble.tr::after { top: 100%; margin-top: -3.5px; border-width: 13px 6.5px 0 6.5px; border-color: #fff transparent transparent transparent; }
.bubble.shout.tl::after, .bubble.shout.tc::after, .bubble.shout.tr::after { border-top-color: var(--shout); }
.bubble.robot.tl::after, .bubble.robot.tc::after, .bubble.robot.tr::after { border-top-color: var(--robot); }
.bubble.tl::before { left: 16%; } .bubble.tl::after { left: calc(16% + 2.5px); }
.bubble.tc::before { left: calc(50% - 9px); } .bubble.tc::after { left: calc(50% - 6.5px); }
.bubble.tr::before { right: 16%; } .bubble.tr::after { right: calc(16% + 2.5px); }
.cover-title { position: absolute; left: 0; right: 0; top: 2.5%; text-align: center; pointer-events: none; }
.cover-title .kicker { display: inline-block; background: var(--ink); color: var(--caption); font-family: var(--display); letter-spacing: .14em; font-size: 3.4cqw; padding: .1em .8em; transform: rotate(-2deg); }
.cover-title h1 {
  margin: .1em 0 0; font-family: var(--display); font-weight: 400; line-height: .92;
  font-size: 11.5cqw; color: var(--caption); letter-spacing: .02em;
  -webkit-text-stroke: .6cqw var(--ink); paint-order: stroke fill;
  text-shadow: .8cqw .8cqw 0 var(--ink); text-wrap: balance;
}
.cover-title .sub { margin-top: .4em; font-family: var(--display); font-size: 5cqw; color: #fff; -webkit-text-stroke: .35cqw var(--ink); paint-order: stroke fill; letter-spacing: .04em; }
.badge { position: absolute; left: 4%; top: 31%; background: #fff; border: 3px solid var(--ink); font-family: var(--display); font-size: 2.6cqw; line-height: 1; padding: .4em .5em; text-align: center; transform: rotate(-4deg); }
.badge b { display: block; font-size: 2em; font-weight: 400; color: var(--red); }
.end-note { color: var(--muted); text-align: center; font-size: 14px; }
@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
  .panel.w2 { grid-column: span 1; aspect-ratio: 8 / 3.6; }
  .panel.cover { aspect-ratio: 8 / 9.5; }
  .page { padding: 10px; }
}
</style>

<div class="book" id="book">

<script>
const INK = '#1b1b1f';
function rand(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let UID = 0;

/* ---------- characters ---------- */
const C = {
  winston:{skin:'#f3cba5',hair:'spiky',shirt:'#2fb36b',sleeve:'#2fb36b',hand:'#f3cba5',pants:'#2d4a8a',shoes:'#e04a2f',stripe:'#ffffff'},
  derek:{skin:'#ecc29b',hair:'neat',glasses:1,shirt:'#1f8a9e',sleeve:'#1f8a9e',hand:'#ecc29b',pants:'#c9a46a',shoes:'#5a3a22',collar:1},
  spidey:{mask:'#d7263d',web:INK,shirt:'#d7263d',sleeve:'#1e5bd8',hand:'#d7263d',pants:'#1e5bd8',shoes:'#d7263d',emblem:INK,bodyWeb:INK},
  spin:{mask:'#232328',web:'#e63946',shirt:'#232328',sleeve:'#232328',hand:'#e63946',pants:'#232328',shoes:'#e63946',emblem:'#e63946',bodyWeb:'#e63946'},
  ghost:{mask:'#fafafa',web:'#8a9aa6',hood:'#fafafa',hoodIn:'#2ec4b6',shirt:'#fafafa',sleeve:'#fafafa',hand:'#ff5ca8',pants:'#fafafa',shoes:'#ff5ca8',emblem:INK,side:'#ff5ca8'},
  goblin:{skin:'#7cc242',face:'goblin',shirt:'#6b2fa3',sleeve:'#5aa832',hand:'#5aa832',pants:'#5aa832',shoes:'#6b2fa3',belt:'#3f1a66'},
  rhino:{mask:'#8d939b',face:'rhino',shirt:'#8d939b',sleeve:'#8d939b',hand:'#7d838b',pants:'#7d838b',shoes:'#666b73',wide:1.45,headR:25}
};
const POSES={down:[12,-12],up:[160,-160],wave:[12,-150],point:[12,-90],cheer:[135,-135],swing:[22,-170],hips:[42,-42],hug:[70,-70],flail:[120,-60]};

function person(c, pose, o){
  o = o||{};
  const W=c.wide||1, [L,R]=POSES[pose||'down'];
  const sy=-116, lx=-28*W, rx=28*W, hy=-150, hr=c.headR||22;
  let s='';
  const arm=(x,a)=>`<g transform="translate(${x},${sy}) rotate(${a})"><rect x="-6.5" y="-4" width="13" height="50" rx="6.5" fill="${c.sleeve}"/><circle cy="50" r="7.5" fill="${c.hand}"/></g>`;
  const rad=R*Math.PI/180, hx=rx-Math.sin(rad)*50, hyy=sy+Math.cos(rad)*50;
  if(o.web) s+=webLine(hx,hyy,hx+o.web,-1400);
  s+=`<rect x="${-21*W}" y="-80" width="${18*W}" height="76" rx="7" fill="${c.pants}"/><rect x="${3*W}" y="-80" width="${18*W}" height="76" rx="7" fill="${c.pants}"/>`;
  s+=`<ellipse cx="${-12*W}" cy="-5" rx="${13*W}" ry="6.5" fill="${c.shoes}"/><ellipse cx="${12*W}" cy="-5" rx="${13*W}" ry="6.5" fill="${c.shoes}"/>`;
  s+=arm(lx,L)+arm(rx,R);
  s+=`<rect x="${-25*W}" y="-128" width="${50*W}" height="56" rx="13" fill="${c.shirt}"/>`;
  if(c.stripe) s+=`<path d="M-12,-126 L-12,-74 M12,-126 L12,-74" stroke="${c.stripe}" stroke-width="3" fill="none"/><path d="M-12,-126 L-12,-74 M12,-126 L12,-74" stroke="${INK}" stroke-width="0.8" fill="none" opacity=".4"/>`;
  if(c.collar) s+=`<path d="M-10,-128 L0,-116 L10,-128" fill="#fff"/>`;
  if(c.side) s+=`<path d="M${-25*W+3},-112 L${-25*W+3},-80 M${25*W-3},-112 L${25*W-3},-80" stroke="${c.side}" stroke-width="5" fill="none"/>`;
  if(c.bodyWeb) s+=`<g stroke="${c.bodyWeb}" stroke-width="1" fill="none" opacity=".75"><path d="M0,-104 L-24,-126 M0,-104 L24,-126 M0,-104 L-25,-96 M0,-104 L25,-96 M0,-104 L-14,-73 M0,-104 L14,-73"/><path d="M-12,-115 Q0,-110 12,-115 M-16,-98 Q0,-92 16,-98"/></g>`;
  if(c.belt) s+=`<rect x="${-25*W}" y="-82" width="${50*W}" height="8" fill="${c.belt}"/>`;
  if(c.emblem) s+=`<g fill="${c.emblem}" stroke="none"><ellipse cy="-102" rx="4" ry="6.5"/><circle cy="-110" r="3"/></g><path d="M-3,-106 L-11,-114 L-13,-108 M3,-106 L11,-114 L13,-108 M-3,-100 L-11,-94 L-13,-88 M3,-100 L11,-94 L13,-88" stroke="${c.emblem}" stroke-width="1.6" fill="none"/>`;
  if(o.hold) s+=`<g transform="translate(${hx},${hyy})">${HOLD[o.hold]}</g>`;
  // head
  if(c.face==='goblin'){
    s+=`<path d="M-20,${hy} L-34,${hy-14} L-22,${hy-6}Z M20,${hy} L34,${hy-14} L22,${hy-6}Z" fill="${c.skin}"/>`;
    s+=`<circle cy="${hy}" r="${hr}" fill="${c.skin}"/>`;
    s+=`<g stroke="none"><ellipse cx="-8" cy="${hy-2}" rx="6" ry="4" fill="#ffe14d"/><ellipse cx="8" cy="${hy-2}" rx="6" ry="4" fill="#ffe14d"/><ellipse cx="-8" cy="${hy-2}" rx="1.5" ry="3.5" fill="${INK}"/><ellipse cx="8" cy="${hy-2}" rx="1.5" ry="3.5" fill="${INK}"/></g>`;
    s+=`<path d="M-15,${hy-10} L-3,${hy-6} M15,${hy-10} L3,${hy-6}" stroke-width="3" fill="none"/>`;
    if(o.mood==='shock'||o.mood==='sad') s+=`<ellipse cx="0" cy="${hy+11}" rx="5" ry="6" fill="${INK}"/>`;
    else s+=`<path d="M-13,${hy+6} Q0,${hy+20} 13,${hy+6} Z" fill="#fff"/><path d="M-6,${hy+8} L-6,${hy+13} M0,${hy+8.5} L0,${hy+15} M6,${hy+8} L6,${hy+13}" stroke-width="1.2" fill="none"/>`;
    s+=`<path d="M-25,${hy-6} Q-22,${hy-30} 2,${hy-30} Q20,${hy-58} 44,${hy-52} Q30,${hy-44} 26,${hy-28} Q28,${hy-16} 25,${hy-6} Q0,${hy-16} -25,${hy-6}Z" fill="#6b2fa3"/>`;
  } else if(c.face==='rhino'){
    s+=`<circle cy="${hy}" r="${hr}" fill="${c.mask}"/>`;
    s+=`<ellipse cx="0" cy="${hy+9}" rx="13" ry="9" fill="#a9aeb5"/>`;
    s+=`<path d="M-4,${hy+2} L2,${hy-30} L10,${hy+1}Z" fill="#efe8d4"/>`;
    s+=`<path d="M-18,${hy-10} L-6,${hy-6} M18,${hy-10} L6,${hy-6}" stroke-width="3.5" fill="none"/>`;
    s+=`<circle cx="-11" cy="${hy-2}" r="2.6" fill="${INK}" stroke="none"/><circle cx="11" cy="${hy-2}" r="2.6" fill="${INK}" stroke="none"/>`;
    s+= o.mood==='sad' ? `<path d="M-6,${hy+14} Q0,${hy+9} 6,${hy+14}" fill="none"/>` : `<path d="M-7,${hy+12} L7,${hy+12}" fill="none"/>`;
    s+=`<path d="M-24,${hy-12} L-30,${hy-22} L-20,${hy-20}Z M24,${hy-12} L30,${hy-22} L20,${hy-20}Z" fill="${c.mask}"/>`;
  } else if(c.mask){
    if(c.hood) s+=`<circle cy="${hy-1}" r="${hr+6}" fill="${c.hood}"/><path d="M${-hr-3},${hy+4} A${hr+3},${hr+3} 0 0 1 ${hr+3},${hy+4}" stroke="${c.hoodIn}" stroke-width="3" fill="none"/>`;
    s+=`<circle cy="${hy}" r="${hr}" fill="${c.mask}"/>`;
    let w='';
    for(let a=0;a<360;a+=40){const r=a*Math.PI/180;w+=`M0,${hy+2} L${(Math.cos(r)*(hr-1)).toFixed(1)},${(hy+2+Math.sin(r)*(hr-1)).toFixed(1)} `;}
    s+=`<path d="${w}" stroke="${c.web}" stroke-width="1.1" fill="none"/><circle cy="${hy+2}" r="${hr*0.55}" stroke="${c.web}" stroke-width="1.1" fill="none"/>`;
    const big = (o.mood==='shock'||o.mood==='wow') ? 1.25 : 1;
    const eye=`M-3,${hy+2} Q-9,${hy-13} -18,${hy-6} Q-16,${hy+7} -3,${hy+2}Z`;
    s+=`<g transform="translate(0,${hy}) scale(${big}) translate(0,${-hy})"><path d="${eye}" fill="#fff" stroke-width="3"/><path d="${eye}" transform="scale(-1,1)" fill="#fff" stroke-width="3"/></g>`;
  } else {
    s+=`<circle cy="${hy}" r="${hr}" fill="${c.skin}"/>`;
    s+=`<circle cx="-13" cy="${hy+6}" r="4" fill="#f08c8c" opacity=".45" stroke="none"/><circle cx="13" cy="${hy+6}" r="4" fill="#f08c8c" opacity=".45" stroke="none"/>`;
    const m=o.mood;
    if(m==='shock'||m==='wow') s+=`<circle cx="-8" cy="${hy-2}" r="4" fill="#fff" stroke-width="1.5"/><circle cx="8" cy="${hy-2}" r="4" fill="#fff" stroke-width="1.5"/><circle cx="-8" cy="${hy-2}" r="1.8" fill="${INK}" stroke="none"/><circle cx="8" cy="${hy-2}" r="1.8" fill="${INK}" stroke="none"/>`;
    else s+=`<circle cx="-8" cy="${hy-2}" r="2.8" fill="${INK}" stroke="none"/><circle cx="8" cy="${hy-2}" r="2.8" fill="${INK}" stroke="none"/>`;
    if(m==='shock'||m==='wow') s+=`<ellipse cx="0" cy="${hy+11}" rx="4.5" ry="5.5" fill="${INK}"/>`;
    else if(m==='sad') s+=`<path d="M-7,${hy+13} Q0,${hy+7} 7,${hy+13}" fill="none"/><path d="M-13,${hy-9} L-4,${hy-7} M13,${hy-9} L4,${hy-7}" stroke-width="1.6" fill="none"/>`;
    else if(m==='laugh') s+=`<path d="M-9,${hy+7} Q0,${hy+21} 9,${hy+7}Z" fill="#8a2a2a"/>`;
    else if(m==='think') s+=`<path d="M-5,${hy+11} L6,${hy+9}" fill="none"/><path d="M-13,${hy-10} L-4,${hy-11}" stroke-width="1.6" fill="none"/>`;
    else s+=`<path d="M-8,${hy+8} Q0,${hy+16} 8,${hy+8}" fill="none"/>`;
    if(c.glasses) s+=`<g fill="none" stroke-width="2"><circle cx="-8" cy="${hy-2}" r="7"/><circle cx="8" cy="${hy-2}" r="7"/><path d="M-1,${hy-2} L1,${hy-2} M-15,${hy-3} L-21,${hy-6} M15,${hy-3} L21,${hy-6}"/></g>`;
    if(c.hair==='spiky') s+=`<path d="M-23,${hy+2} L-27,${hy-14} L-19,${hy-17} L-17,${hy-29} L-7,${hy-22} L0,${hy-34} L7,${hy-22} L17,${hy-29} L19,${hy-17} L27,${hy-12} L23,${hy+2} Q20,${hy-10} 8,${hy-13} Q-6,${hy-8} -23,${hy+2}Z" fill="${INK}"/>`;
    if(c.hair==='neat') s+=`<path d="M-23,${hy+3} Q-27,${hy-27} 0,${hy-26} Q25,${hy-27} 23,${hy-1} Q19,${hy-13} 5,${hy-15} Q-9,${hy-11} -16,${hy-13} Q-20,${hy-6} -23,${hy+3}Z" fill="${INK}"/>`;
  }
  if(o.glider) s+=`<path d="M-80,6 Q-45,-8 0,-1 Q45,-8 80,6 Q58,18 35,11 Q18,25 0,14 Q-18,25 -35,11 Q-58,18 -80,6Z" fill="#3c6e1f"/><ellipse cx="0" cy="18" rx="10" ry="6" fill="#ff9f1c"/><path d="M-6,22 L0,40 L6,22" fill="#ffd166"/>`;
  return s;
}
const HOLD={
  remote:`<rect x="-7" y="-14" width="14" height="22" rx="3" fill="#333a44"/><path d="M4,-14 L8,-28" fill="none"/><circle cx="8" cy="-29" r="3" fill="#ff3b3b"/><rect x="-4" y="-8" width="8" height="5" fill="#3ad0ff" stroke="none"/>`,
  mop:`<path d="M0,-50 L0,95" stroke="#a0703a" stroke-width="5"/><path d="M0,-50 L0,95" stroke="${INK}" stroke-width="1" fill="none" opacity=".4"/><path d="M-18,95 L18,95 L22,118 L-22,118Z" fill="#e9e3cf"/>`,
  band:`<rect x="-9" y="-4" width="18" height="9" rx="3" fill="#d7263d"/>`
};

function bolt(pose){
  const [L,R] = pose==='cheer'?[140,-140]:pose==='wave'?[12,-150]:[15,-15];
  const arm=(x,a)=>`<g transform="translate(${x},-55) rotate(${a})"><rect x="-4" y="0" width="8" height="26" rx="3" fill="#9fb0c0"/><circle cy="28" r="5" fill="#ffb703"/></g>`;
  return `<rect x="-16" y="-24" width="10" height="20" fill="#9fb0c0"/><rect x="6" y="-24" width="10" height="20" fill="#9fb0c0"/><rect x="-20" y="-7" width="16" height="7" rx="2" fill="#4a5563"/><rect x="4" y="-7" width="16" height="7" rx="2" fill="#4a5563"/>`+
    arm(-24,L)+arm(24,R)+
    `<rect x="-24" y="-64" width="48" height="42" rx="6" fill="#c9d3dd"/><rect x="-12" y="-55" width="24" height="14" rx="2" fill="#2b3a4a"/><path d="M-8,-48 L-3,-52 L2,-44 L7,-49" stroke="#7CFC00" stroke-width="2" fill="none"/>`+
    `<text x="0" y="-27" font-family="Bangers, Impact, sans-serif" font-size="9" text-anchor="middle" fill="${INK}" stroke="none">BOLT</text>`+
    `<rect x="-6" y="-70" width="12" height="7" fill="#9fb0c0"/><rect x="-20" y="-96" width="40" height="28" rx="6" fill="#c9d3dd"/><rect x="-14" y="-89" width="10" height="9" rx="2" fill="#3ad0ff"/><rect x="4" y="-89" width="10" height="9" rx="2" fill="#3ad0ff"/><path d="M-6,-75 Q0,-71 6,-75" fill="none"/><path d="M0,-96 L0,-108" fill="none"/><circle cy="-111" r="4" fill="#ff3b3b"/>`;
}
function tracee(){
  return `<ellipse cx="0" cy="34" rx="16" ry="4" fill="#000" opacity=".18" stroke="none"/><circle r="20" fill="#e9eef3"/><rect x="-15" y="-8" width="30" height="12" rx="6" fill="#1e5bd8"/><circle cx="-6" cy="-2" r="2.5" fill="#9ff" stroke="none"/><circle cx="6" cy="-2" r="2.5" fill="#9ff" stroke="none"/><path d="M0,-20 L0,-30" fill="none"/><circle cy="-32" r="3.5" fill="#d7263d"/><path d="M-20,2 L-28,8 M20,2 L28,8" fill="none"/>`;
}
function machine(){
  let s=`<path d="M38,-128 L102,-170 L114,-152 L48,-108Z" fill="#7a7f88"/><ellipse cx="108" cy="-161" rx="7" ry="11" transform="rotate(-34 108 -161)" fill="#3c6e1f"/>`;
  s+=`<rect x="-82" y="-84" width="164" height="84" rx="8" fill="#5d2b8f"/><rect x="-72" y="-74" width="56" height="28" rx="4" fill="#2b1645"/>`;

function skyline(w, base, r, fill, win, minH, maxH){
  let s='', x=-10;
  while(x<w){const bw=38+r()*60, bh=minH+r()*(maxH-minH);s+=`<rect x="${x.toFixed(0)}" y="${(base-bh).toFixed(0)}" width="${bw.toFixed(0)}" height="${bh.toFixed(0)}" fill="${fill}" stroke="${INK}" stroke-width="1.5"/>`;
    if(win){for(let wy=base-bh+10;wy<base-12;wy+=16)for(let wx=x+7;wx<x+bw-10;wx+=13)if(r()>.45)s+=`<rect x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="6" height="8" fill="${win}"/>`;}
    x+=bw+2+r()*8;}
  return s;
}
function clouds(w, r, n){let s='';for(let i=0;i<n;i++){const x=r()*w,y=20+r()*70,k=0.6+r()*0.7;s+=`<g transform="translate(${x.toFixed(0)},${y.toFixed(0)}) scale(${k.toFixed(2)})" fill="#fff" stroke="${INK}" stroke-width="2"><path d="M-40,10 Q-44,-8 -24,-8 Q-20,-26 0,-22 Q14,-34 28,-18 Q48,-18 44,0 Q50,12 34,12 L-30,12 Q-44,14 -40,10Z"/></g>`;}return s;}
function grad(id, a, b){return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs>`;}
function burst(w,h,cx,cy,a,b){let s=`<rect width="${w}" height="${h}" fill="${a}"/>`;const n=28,R=Math.max(w,h)*1.5;for(let i=0;i<n;i+=2){const a1=i/n*Math.PI*2,a2=(i+1)/n*Math.PI*2;s+=`<path d="M${cx},${cy} L${(cx+Math.cos(a1)*R).toFixed(0)},${(cy+Math.sin(a1)*R).toFixed(0)} L${(cx+Math.cos(a2)*R).toFixed(0)},${(cy+Math.sin(a2)*R).toFixed(0)}Z" fill="${b}"/>`;}return s;}

/* ---------- render ---------- */
const book=document.getElementById('book');
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function svgFor(p, w, h, seed){
  const r=rand(seed);
  let s=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(p.alt||'comic panel')}"><g stroke="${INK}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">`;
  s+=bg(p.bg,w,h,r);
  (p.items||[]).forEach(it=>{s+=item(it,r);});
  (p.sfx||[]).forEach(([t,x,y,size,rot,fill])=>{s+=`<text x="${x}" y="${y}" transform="rotate(${rot} ${x} ${y})" font-family="Bangers, Impact, sans-serif" font-size="${size}" letter-spacing="2" fill="${fill}" stroke="${INK}" stroke-width="${size/7}" paint-order="stroke" text-anchor="${x>w*0.35&&x<w*0.65?'middle':'start'}">${t}</text>`;});
  return s+'</g></svg>';
}
function overlays(p){
  let s='';
  if(p.cap) s+=`<div class="cap">${esc(p.cap)}</div>`;
  (p.b||[]).forEach(([x,y,w,t,tail,cls])=>{s+=`<div class="bubble ${tail||''} ${cls||''}" style="left:${x}%;top:${y}%;width:${w}%">${esc(t)}</div>`;});
  return s;
}
let seed=7;
PAGES.forEach((pg,i)=>{
  const page=document.createElement('section');
  page.className='page';
  const n=i+1;
  if(pg.cover){
    const items=[['goblin',665,430,1,'cheer'],['spin',180,770,1.35,'point'],['spidey',400,750,1.5,'cheer'],['ghost',620,770,1.35,'wave'],['winston',280,920,1.1,'cheer',{mood:'laugh'}],['bolt',400,920,1.2,'cheer'],['derek',530,920,1.3,'wave',{mood:'laugh'}]];
    page.innerHTML=`<div class="panel cover" style="aspect-ratio:8/9.5">${svgFor({bg:'cover',items},800,950,seed++)}`+
      `<div class="badge">No.<b>1</b>Nov 2026</div>`+
      `<div class="cover-title"><span class="kicker">WINSTON &amp; DEREK PANG with THE SPIDEY TEAM</span><h1>The Great Goo Caper</h1><div class="sub">A robot! A goblin! A whole lot of confetti!</div></div></div>`;
  } else {
    let html=`<div class="page-head"><h2>${esc(pg.title)}</h2><span>Page ${n} of ${PAGES.length}</span></div><div class="grid">`;
    pg.panels.forEach(p=>{const w=p.w===2?800:400;html+=`<div class="panel${p.w===2?' w2':''}">${svgFor(p,w,300,seed++)}${overlays(p)}</div>`;});
    page.innerHTML=html+'</div>';
  }
  book.appendChild(page);
});
const end=document.createElement('p');end.className='end-note';end.textContent='A fan-made comic for the Pang family. Spidey and friends belong to their creators.';book.appendChild(end);
</script>
